# AWS runner profiles. Keep sizing here; workflows select names without shape overrides.
# Public repositories resolve this catalog from the default branch.
# dev-machines bakes these from scripts/tooling for the operations in .config/images.toml;
# `dev-machine image-refresh cargo-rail` rebuilds stale ones. Rebuild within 25 days:
# GitHub rejects runner agents older than 30 days.
images:
  cargo-rail-ci-windows-x64:
    platform: windows
    arch: x64
    ami: ami-00836d523b37a565d
runners:
  x86_64-linux:
    family: [c7a.2xlarge, c7i.2xlarge, c8a.2xlarge, c8i.2xlarge]
    cpu: 8
    image: ubuntu24-full-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  aarch64-linux:
    # Retain memory headroom for the native compiler and cache tests.
    family: [m7g.2xlarge, m8g.2xlarge]
    cpu: 8
    image: ubuntu24-full-arm64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  x86_64-win:
    family: [c7a.2xlarge, c8a.2xlarge]
    cpu: 8
    image: cargo-rail-ci-windows-x64
    spot: false
    volume: 200gb:gp3
