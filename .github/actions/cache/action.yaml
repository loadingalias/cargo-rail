name: Setup Cargo and Cargo-Rail caches
description: Preserve Cargo inputs and enable authenticated compiler reuse when remote authority is present.

inputs:
  cache-key:
    description: Job-specific Cargo cache key
    required: true
  shared-key:
    description: Stable Cargo cache namespace
    required: false
    default: cargo-rail-v3
  save-if:
    description: Whether Swatinem/rust-cache may save this job's Cargo cache
    required: false
    default: "false"
  remote-url:
    description: Machine-owned Cargo-Rail cache URL; empty keeps compiler reuse local
    required: false
    default: ""
  remote-mode:
    description: Cargo-Rail remote authority
    required: false
    default: read
  remote-access-key-id:
    description: R2 access key ID, mapped only to the pinned Cargo-Rail cache action
    required: false
    default: ""
  remote-secret-access-key:
    description: R2 secret access key, mapped only to the pinned Cargo-Rail cache action
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Preserve Cargo inputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
        cache-bin: false
        cache-targets: ${{ inputs.remote-url == '' }}
        save-if: ${{ inputs.save-if }}

    - name: Validate R2 cache authority
      if: inputs.remote-url != ''
      shell: bash
      env:
        CARGO_RAIL_CACHE_REMOTE: ${{ inputs.remote-url }}
      run: |
        set -euo pipefail
        case "$CARGO_RAIL_CACHE_REMOTE" in
          r2://*) ;;
          *)
            echo "This repository accepts only a Cloudflare R2 compiler-cache authority." >&2
            exit 2
            ;;
        esac

    - name: Require R2 cache credentials
      if: inputs.remote-url != '' && (inputs.remote-access-key-id == '' || inputs.remote-secret-access-key == '')
      shell: bash
      run: |
        echo "The selected R2 compiler cache requires both repository credentials." >&2
        exit 2

    - name: Enable Cargo-Rail compiler reuse
      if: inputs.remote-url != ''
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.remote-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.remote-secret-access-key }}
        AWS_EC2_METADATA_DISABLED: "true"
      uses: loadingalias/cargo-rail-action/cache@78ad385a85627484a5b634cf1bc3caa1de872c6a # v8.2.0
      with:
        url: ${{ inputs.remote-url }}
        mode: ${{ inputs.remote-mode }}
        max-size: 10GiB
        root-portability: remap
        strict-probe: "true"
        version: 0.25.0
