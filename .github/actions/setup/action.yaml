name: Setup cargo-rail Environment
description: |
  Install Rust toolchain, cargo tools, and configure caching.

inputs:
  cache-key:
    description: Additional cache key suffix
    required: false
    default: ""
  install-nextest:
    description: Install cargo-nextest for jobs that execute tests
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install repository Rust toolchain
      shell: bash
      run: scripts/ci/install-rust-toolchain.sh --components clippy,rustfmt

    - name: Install just
      uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
      with:
        tool: just@1.58.0

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
      with:
        tool: cargo-nextest@0.9.143

    - name: Setup Rust Cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: "cargo-rail-v2"
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
