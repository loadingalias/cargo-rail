name: Setup cargo-rail Environment
description: |
  Install Rust toolchain, cargo tools, and configure caching.

inputs:
  cache-key:
    description: Additional cache key suffix
    required: false
    default: ""
  install-nextest:
    description: Install cargo-nextest for jobs that execute tests
    required: false
    default: "true"
  native-cache-url:
    description: Machine-owned Cargo-Rail remote cache URL
    required: false
    default: ""
  native-cache-mode:
    description: Cargo-Rail remote authority
    required: false
    default: read
  native-cache-access-key-id:
    description: R2 access key ID forwarded only to Cargo-Rail cache setup
    required: false
    default: ""
  native-cache-secret-access-key:
    description: R2 secret access key forwarded only to Cargo-Rail cache setup
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install repository Rust toolchain
      shell: bash
      run: scripts/ci/install-rust-toolchain.sh --components clippy,rustfmt

    - name: Install just
      uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
      with:
        tool: just@1.58.0

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
      with:
        tool: cargo-nextest@0.9.143

    - name: Setup Cargo and compiler caches
      uses: ./.github/actions/cache
      with:
        cache-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        remote-url: ${{ inputs.native-cache-url }}
        remote-mode: ${{ inputs.native-cache-mode }}
        remote-access-key-id: ${{ inputs.native-cache-access-key-id }}
        remote-secret-access-key: ${{ inputs.native-cache-secret-access-key }}
