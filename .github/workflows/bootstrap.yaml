name: Bootstrap CI (No Change Detection)

# Manual trigger only - escape hatch for testing cargo-rail changes
# without dogfooding cargo-rail-action
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''
        type: string

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_RAIL_TEST_MODE: commit
  CARGO_INCREMENTAL: 0

# Lock down permissions to read-only by default
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ==========================================================================
  # Job 1: MSRV enforcement (fast fail)
  # ==========================================================================
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Detect MSRV
        id: msrv
        shell: bash
        run: |
          msrv="$(python3 - <<'PY'
          import pathlib, tomllib

          data = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          msrv = (
              data.get("workspace", {}).get("package", {}).get("rust-version")
              or data.get("package", {}).get("rust-version")
          )
          if isinstance(msrv, dict):
              msrv = None
          if not msrv:
              raise SystemExit("No rust-version found in Cargo.toml")
          print(msrv)
          PY
          )"

          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "Using MSRV: $msrv"

      - name: Install Rust MSRV Toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88  # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: "cargo-rail-msrv-v1"
          key: msrv-${{ steps.msrv.outputs.msrv }}
          cache-on-failure: true

      - name: Compile (MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  # ==========================================================================
  # Job 2: Full CI matrix (no change detection)
  # ==========================================================================
  ci:
    name: CI (${{ matrix.target.name }})
    needs: msrv
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # Run all targets even if one fails
      matrix:
        target:
          # Linux x86-64
          - name: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cache-key: bootstrap-linux-x64

          # Linux ARM64
          - name: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cache-key: bootstrap-linux-arm64

          # Windows x86-64
          - name: x86_64-pc-windows-msvc
            runner: windows-latest
            cache-key: bootstrap-windows-x64

          # Windows ARM64
          - name: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cache-key: bootstrap-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.target.cache-key }}

      - name: Quality Checks
        run: just ci-check

      - name: Build
        run: just build-all

      - name: Tests
        run: just test-all

      - name: Upload JUnit Test Report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: junit-report-${{ matrix.target.name }}
          path: target/nextest/commit/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Detect JUnit Test Report
        if: always()
        id: junit
        shell: bash
        run: |
          if [ -f target/nextest/commit/junit.xml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Test Report
        if: always() && steps.junit.outputs.found == 'true'
        uses: mikepenz/action-junit-report@74626db7353a25a20a72816467ebf035f674c5f8  # v6.2.0
        with:
          report_paths: 'target/nextest/commit/junit.xml'
          check_name: 'Test Results (${{ matrix.target.name }})'
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          annotate_only: false
          summary: true
