name: Bootstrap CI (No Change Detection)

# Manual exact-ref gate for planner or configuration protocol changes.
# Bootstrap the candidate SHA, release it, then pin commit.yaml before restoring normal dogfooding.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test"
        required: false
        default: ""
        type: string

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_RAIL_TEST_MODE: commit
  CARGO_INCREMENTAL: 0

# Lock down permissions to read-only by default
permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: bootstrap-quality
          install-nextest: "true"

      - name: Install cargo-deny
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-deny@0.20.2

      - name: Quality checks
        run: just check

      - name: Exact compiler fact driver
        run: |
          rustup component add rustc-dev --toolchain "$RUSTUP_TOOLCHAIN"
          just check-compiler-fact-driver

      - name: Enforce Rust surface
        run: |
          scripts/with-compiler-fact-driver.sh cargo build --locked \
            --bin cargo-rail --bin cargo-rail-compiler-observation
          target/debug/cargo-rail rail surface --check --format github

  compatibility:
    name: Compatibility
    needs: quality
    uses: ./.github/workflows/compatibility.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      cache-prefix: bootstrap
