name: Compatibility

on:
  workflow_call:
    inputs:
      ref:
        description: Exact ref to test
        required: false
        default: ""
        type: string
      cache-prefix:
        description: Caller-specific cache namespace
        required: true
        type: string
      compatibility-matrix:
        description: Planner-selected compatibility matrix or explicit all
        required: false
        default: "all"
        type: string
      filesystem-matrix:
        description: Planner-selected filesystem matrix or explicit all
        required: false
        default: "all"
        type: string
      plan-artifact:
        description: Exact v8 plan artifact to verify before execution
        required: false
        default: ""
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_RAIL_TEST_MODE: commit
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  checks: write

jobs:
  support:
    name: Support matrices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      compatibility-matrix: ${{ steps.matrices.outputs.compatibility }}
      filesystem-matrix: ${{ steps.matrices.outputs.filesystem }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download exact plan
        if: inputs.plan-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: target

      - name: Verify checkout against plan
        if: inputs.plan-artifact != ''
        run: scripts/plan/read.py verify-checkout target/plan-v8.json

      - name: Generate compatibility matrices
        id: matrices
        shell: bash
        env:
          SELECTED_COMPATIBILITY_MATRIX: ${{ inputs.compatibility-matrix }}
          SELECTED_FILESYSTEM_MATRIX: ${{ inputs.filesystem-matrix }}
        run: |
          if [ "$SELECTED_COMPATIBILITY_MATRIX" = all ]; then
            compatibility="$(python3 scripts/ci/support-matrix.py --compatibility-matrix)"
          else
            compatibility="$SELECTED_COMPATIBILITY_MATRIX"
          fi
          if [ "$SELECTED_FILESYSTEM_MATRIX" = all ]; then
            filesystem="$(python3 scripts/ci/support-matrix.py --filesystem-matrix)"
          else
            filesystem="$SELECTED_FILESYSTEM_MATRIX"
          fi
          {
            echo "compatibility=$compatibility"
            echo "filesystem=$filesystem"
          } >> "$GITHUB_OUTPUT"

  msrv:
    name: MSRV (${{ matrix.compatibility.name }})
    needs: support
    runs-on: ${{ matrix.compatibility.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.compatibility-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact plan
        if: inputs.plan-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: target

      - name: Verify checkout against plan
        if: inputs.plan-artifact != ''
        run: scripts/plan/read.py verify-checkout target/plan-v8.json

      - name: Install selected Rust toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.compatibility.toolchain }}
          TARGETS: ${{ matrix.compatibility.targets }}
        run: >-
          scripts/ci/install-rust-toolchain.sh
          --toolchain "$TOOLCHAIN"
          --components clippy,rustfmt
          --targets "$TARGETS"

      - name: Install just for endpoint suites
        if: matrix.compatibility.full-suite
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: just@1.58.0

      - name: Install cargo-nextest for endpoint suites
        if: matrix.compatibility.full-suite
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-nextest@0.9.143

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "cargo-rail-compatibility-v1"
          key: ${{ inputs.cache-prefix }}-${{ matrix.compatibility.cache-key }}
          cache-on-failure: true

      - name: Build cargo-rail executables with selected toolchain
        run: cargo build --locked --bins

      - name: Verify Windows installer
        if: matrix.compatibility.full-suite && runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/test-install.ps1

      - name: Verify distributed worker front door
        shell: bash
        run: |
          worker="target/debug/cargo-rail-distributed-worker"
          python_command=python3
          if [ "$RUNNER_OS" = "Windows" ]; then
            worker="${worker}.exe"
          fi
          if ! command -v "$python_command" >/dev/null 2>&1; then
            python_command=python
          fi
          "$python_command" scripts/ci/verify-distributed-worker.py --worker "$worker" --rustc rustc

      - name: Verify default native filesystem
        if: matrix.compatibility.selection-probes
        shell: bash
        run: |
          python_command=python3
          if ! command -v "$python_command" >/dev/null 2>&1; then
            python_command=python
          fi
          "$python_command" scripts/ci/run-filesystem-compatibility.py \
            --root "$RUNNER_TEMP" \
            --expected-filesystem "${{ matrix.compatibility.filesystem }}" \
            --expected-case-sensitive "${{ matrix.compatibility.case-sensitive }}"

      - name: Run front-door compatibility corpus
        shell: bash
        run: |
          cargo_rail="target/debug/cargo-rail"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo_rail="${cargo_rail}.exe"
          fi
          python_command=python3
          if ! command -v "$python_command" >/dev/null 2>&1; then
            python_command=python
          fi
          selection_args=()
          if [ "${{ matrix.compatibility.selection-probes }}" = "true" ]; then
            selection_args=(--selection-probes)
          fi
          if [ "${{ matrix.compatibility.cross-target-mutation-probes }}" = "true" ]; then
            selection_args+=(--cross-target-mutation-probes)
          fi
          "$python_command" scripts/ci/run-compatibility.py \
            --cargo-rail "$cargo_rail" \
            --toolchain "${{ matrix.compatibility.toolchain }}" \
            --expected-rust-release "${{ matrix.compatibility.release }}" \
            --expected-host "${{ matrix.compatibility.target }}" \
            "${selection_args[@]}"

      - name: Build all endpoint targets
        if: matrix.compatibility.full-suite
        run: just build-all

      - name: Run full endpoint suite
        if: matrix.compatibility.full-suite && runner.os != 'Windows'
        run: just test-all

      - name: Run full Windows endpoint suite
        if: matrix.compatibility.full-suite && runner.os == 'Windows'
        run: cargo nextest run --workspace -P commit --all-features --locked --config-file .config/nextest.toml

      - name: Run doctests
        if: matrix.compatibility.full-suite
        run: cargo test --doc -p cargo-rail --all-features --locked

      - name: Qualify exact compiler fact driver
        if: matrix.compatibility.full-suite
        run: |
          rustup component add rustc-dev --toolchain "$RUSTUP_TOOLCHAIN"
          just check-compiler-fact-driver

      - name: Upload JUnit test report
        if: always() && matrix.compatibility.full-suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.compatibility.target }}-rust-${{ matrix.compatibility.release }}
          path: target/nextest/commit/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Detect JUnit test report
        if: always() && matrix.compatibility.full-suite
        id: junit
        shell: bash
        run: |
          if [ -f target/nextest/commit/junit.xml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish test report
        if: always() && steps.junit.outputs.found == 'true'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: "target/nextest/commit/junit.xml"
          check_name: "Tests (${{ matrix.compatibility.target }}, Rust ${{ matrix.compatibility.release }})"
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
          annotate_only: false
          summary: true

  filesystem:
    name: Filesystem (${{ matrix.filesystem.name }})
    needs: support
    runs-on: ${{ matrix.filesystem.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.support.outputs.filesystem-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact plan
        if: inputs.plan-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: target

      - name: Verify checkout against plan
        if: inputs.plan-artifact != ''
        run: scripts/plan/read.py verify-checkout target/plan-v8.json

      - name: Install selected Rust toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.filesystem.toolchain }}
        run: scripts/ci/install-rust-toolchain.sh --toolchain "$TOOLCHAIN"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-nextest@0.9.143

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "cargo-rail-filesystem-v1"
          key: ${{ inputs.cache-prefix }}-${{ matrix.filesystem.name }}
          cache-on-failure: true

      - name: Build cargo-rail and filesystem tests outside the qualified volume
        shell: bash
        run: |
          cargo build --locked --bins
          cargo nextest run -p cargo-rail -P commit --all-features --lib --locked \
            --config-file .config/nextest.toml --no-run

      - name: Strip Linux native wrapper debug sections
        if: runner.os == 'Linux'
        run: strip --strip-debug target/debug/cargo-rail-native-rustc-wrapper

      - name: Provision Linux tmpfs volume
        if: matrix.filesystem.setup == 'linux-tmpfs'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/cargo-rail-tmpfs"
          mkdir -p "$mount"
          sudo mount -t tmpfs -o size=512m,mode=0700 cargo-rail-tmpfs "$mount"
          sudo chown "$(id -u):$(id -g)" "$mount"
          mkdir "$mount/tmp"
          {
            echo "FILESYSTEM_ROOT=$mount"
            echo "TMPDIR=$mount/tmp"
            echo "TMP=$mount/tmp"
            echo "TEMP=$mount/tmp"
          } >> "$GITHUB_ENV"

      - name: Provision NTFS VHD and UNC share
        if: matrix.filesystem.setup == 'windows-ntfs-vhd'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'cargo-rail-ntfs.vhd'
          $diskpart = Join-Path $env:RUNNER_TEMP 'cargo-rail-ntfs-create.txt'
          $used = Get-Volume | Where-Object DriveLetter | ForEach-Object { $_.DriveLetter.ToString().ToUpperInvariant() }
          $drive = @('R', 'S', 'T', 'U', 'V', 'W') | Where-Object { $_ -notin $used } | Select-Object -First 1
          if (-not $drive) {
            throw 'No drive letter is available for the NTFS qualification VHD'
          }
          @"
          create vdisk file="$vhd" maximum=512 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=CARGORAIL
          assign letter=$drive
          exit
          "@ | Set-Content -Path $diskpart -Encoding ascii
          & diskpart.exe /s $diskpart
          if ($LASTEXITCODE -ne 0) {
            throw "diskpart exited $LASTEXITCODE"
          }
          $root = "${drive}:\cargo-rail"
          $temporary = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          $share = "cargo-rail-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare -Name $share -Path $root -FullAccess $identity | Out-Null
          $unc = "\\localhost\$share"
          if (-not (Test-Path $unc)) {
            throw "UNC qualification share is unavailable: $unc"
          }
          @(
            "FILESYSTEM_IMAGE=$vhd"
            "FILESYSTEM_DRIVE=$drive"
            "FILESYSTEM_ROOT=$root"
            "FILESYSTEM_SHARE=$share"
            "FILESYSTEM_UNC_ROOT=$unc"
            "TMPDIR=$temporary"
            "TMP=$temporary"
            "TEMP=$temporary"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Verify qualified filesystem semantics
        shell: bash
        run: |
          set -euo pipefail
          python_command=python3
          if ! command -v "$python_command" >/dev/null 2>&1; then
            python_command=python
          fi
          filesystem_args=(
            --root "$FILESYSTEM_ROOT"
            --expected-filesystem "${{ matrix.filesystem.kind }}"
            --expected-case-sensitive "${{ matrix.filesystem.case-sensitive }}"
          )
          if [ -n "${FILESYSTEM_UNC_ROOT:-}" ]; then
            filesystem_args+=(--unc-root "$FILESYSTEM_UNC_ROOT")
          fi
          "$python_command" scripts/ci/run-filesystem-compatibility.py "${filesystem_args[@]}"

      - name: Run filesystem authority and publication tests
        shell: bash
        run: |
          cargo nextest run -p cargo-rail -P commit --all-features --lib --locked --config-file .config/nextest.toml \
            -E 'test(~cache::cas::tests) | test(~utils::tests)'

      - name: Qualify cross-volume exact compiler staging
        if: matrix.filesystem.setup == 'windows-ntfs-vhd'
        shell: bash
        run: |
          rustup component add rustc-dev --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/test-compiler-fact-protocol.sh

      - name: Run front-door corpus on the qualified filesystem
        shell: bash
        run: |
          cargo_rail="target/debug/cargo-rail"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo_rail="${cargo_rail}.exe"
          fi
          python_command=python3
          if ! command -v "$python_command" >/dev/null 2>&1; then
            python_command=python
          fi
          "$python_command" scripts/ci/run-compatibility.py \
            --cargo-rail "$cargo_rail" \
            --toolchain "${{ matrix.filesystem.toolchain }}" \
            --expected-rust-release "${{ matrix.filesystem.release }}" \
            --expected-host "${{ matrix.filesystem.target }}" \
            --skip-cross-target-corpus \
            --temporary-root "$FILESYSTEM_ROOT"

      - name: Prove ENOSPC leaves the old file authoritative
        shell: bash
        env:
          CARGO_RAIL_TEST_ENOSPC_ROOT: ${{ env.FILESYSTEM_ROOT }}
          CARGO_RAIL_TEST_ENOSPC_MAX_BYTES: 536870912
        run: |
          cargo nextest run -p cargo-rail -P commit --all-features --lib --locked --config-file .config/nextest.toml \
            -E 'test(=utils::tests::atomic_replacement_preserves_the_old_file_when_the_filesystem_is_full)'

      - name: Unmount Linux tmpfs volume
        if: always() && matrix.filesystem.setup == 'linux-tmpfs'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/cargo-rail-tmpfs"
          if mountpoint -q "$mount"; then
            sudo umount "$mount"
          fi
          rmdir "$mount" 2>/dev/null || true

      - name: Detach NTFS VHD and remove UNC share
        if: always() && matrix.filesystem.setup == 'windows-ntfs-vhd'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = if ($env:FILESYSTEM_SHARE) {
            $env:FILESYSTEM_SHARE
          } else {
            "cargo-rail-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          if (Get-SmbShare -Name $share -ErrorAction SilentlyContinue) {
            Remove-SmbShare -Name $share -Force
          }
          $vhd = if ($env:FILESYSTEM_IMAGE) {
            $env:FILESYSTEM_IMAGE
          } else {
            Join-Path $env:RUNNER_TEMP 'cargo-rail-ntfs.vhd'
          }
          if (Test-Path $vhd) {
            Dismount-DiskImage -ImagePath $vhd
            if ((Get-DiskImage -ImagePath $vhd).Attached) {
              throw "NTFS qualification VHD remained attached: $vhd"
            }
            Remove-Item -Force $vhd
          }
