name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto, major, minor, patch, prerelease, release, or an exact version
        type: string
        default: auto
permissions: {}
concurrency:
  group: cargo-rail-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write # Push the release commit and tag, and create the draft release.
    outputs:
      state: ${{ steps.release.outputs.state }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install release tooling
        run: scripts/tooling/package-unix.sh x86_64-unknown-linux-gnu
      - uses: loadingalias/cargo-rail-action/cache@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        id: cache
        with:
          version: 0.30.1
          remote: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
          mode: read-write
          max-size: 10GiB
          root-portability: remap
          verify-remote: true
      # The Action's locked engine predates this release, so the source-built engine releases itself.
      - name: Build this release engine
        run: cargo build --locked --bin cargo-rail
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: scripts/release.sh --bump "$BUMP"
      - uses: loadingalias/cargo-rail-action/cache/collect@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        if: always() && steps.cache.outcome == 'success'
        id: cache-record
        with:
          job: release
          output-directory: ${{ runner.temp }}/cache-records
      - uses: loadingalias/cargo-rail-action/cache/report@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        if: always() && steps.cache-record.outcome == 'success'
        with:
          records-directory: ${{ runner.temp }}/cache-records
          expected-jobs: '["release"]'

  package:
    name: Package
    needs: release
    if: needs.release.outputs.state == 'awaiting_assets'
    permissions:
      contents: write # Attach the archives to the draft release.
      id-token: write # Mint the Sigstore signing certificate.
      attestations: write # Persist the signed provenance.
      artifact-metadata: write # Record the attested artifact subjects.
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository]
    with:
      release-tag: ${{ needs.release.outputs.tag }}
    secrets:
      CARGO_RAIL_R2_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
      CARGO_RAIL_R2_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}

  publish:
    name: Publish
    needs: [release, package]
    if: needs.package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # Publish the GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install release tooling
        run: scripts/tooling/package-unix.sh x86_64-unknown-linux-gnu
      - name: Build this release engine
        run: cargo build --locked --bin cargo-rail
      - name: Verify the assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release.sh
