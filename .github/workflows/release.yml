name: Release
on:
  workflow_dispatch:
    inputs:
      transaction:
        description: Retained transaction to continue; empty starts a new request
        type: string
      intent:
        description: Immutable intent identity supplied by Cargo-Rail
        type: string
      source:
        description: Exact request source supplied by Cargo-Rail
        type: string
      bump:
        description: auto, major, minor, patch, prerelease, release, or an exact version
        type: string
        default: auto
      publish:
        description: Authorize crates.io publication
        type: boolean
        default: false
      review:
        description: Review preparation through a pull request
        type: boolean
        default: false
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: cargo-rail-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'rail/release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Build this release engine
        run: |
          scripts/tooling/package-unix.sh x86_64-unknown-linux-gnu
          cargo build --locked --bin cargo-rail
      - name: Execute the durable request
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TRANSACTION: ${{ inputs.transaction }}
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ inputs.publish }}
          REVIEW: ${{ inputs.review }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          core="$GITHUB_WORKSPACE/target/debug/cargo-rail"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$TRANSACTION" ]]; then
            args=(release run --all --executor --yes --bump "$BUMP")
            if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
            if [[ "$REVIEW" == true ]]; then args+=(--pr); fi
          else
            args=(release resume --executor)
            if [[ -n "$TRANSACTION" ]]; then args+=("$TRANSACTION"); fi
          fi
          "$core" "${args[@]}"
