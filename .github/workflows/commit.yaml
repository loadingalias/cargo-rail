name: Commit

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_RAIL_TEST_MODE: commit
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ==========================================================================
  # Job 1: Planner
  # ==========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      docs: ${{ steps.plan.outputs.docs }}
      infra: ${{ steps.plan.outputs.infra }}
      base-ref: ${{ steps.plan.outputs.base-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Plan
        id: plan
        uses: loadingalias/cargo-rail-action@1dc464f6c1e4a1606b6bd64cd9e671b68fae3a22  # v6.1.1
        with:
          version: 0.20.0
          since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          args: '--explain'

  quality:
    name: Quality and Security
    needs: plan
    if: needs.plan.outputs.build == 'true' || needs.plan.outputs.test == 'true' || needs.plan.outputs.docs == 'true' || needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: commit-quality
          install-nextest: "false"

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: cargo-audit

      - name: Quality checks
        run: just ci-check

  compatibility:
    name: Compatibility
    needs: [quality, plan]
    if: needs.plan.outputs.build == 'true' || needs.plan.outputs.test == 'true' || needs.plan.outputs.infra == 'true'
    uses: ./.github/workflows/compatibility.yaml
    with:
      ref: ${{ github.sha }}
      cache-prefix: commit
