name: Commit

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_RAIL_TEST_MODE: commit
  CARGO_INCREMENTAL: 0
  CARGO_RAIL_CACHE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CARGO_RAIL_CACHE_REMOTE || '' }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Job 1: Planner
  # ==========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required-work: ${{ steps.outputs.outputs.required-work }}
      compatibility-matrix: ${{ steps.outputs.outputs.compatibility-matrix }}
      filesystem-matrix: ${{ steps.outputs.outputs.filesystem-matrix }}
      release-archive-matrix: ${{ steps.outputs.outputs.release-archive-matrix }}
      plan-identity: ${{ steps.outputs.outputs.plan-identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup planner toolchain
        uses: ./.github/actions/setup
        with:
          cache-key: commit-plan
          install-nextest: "false"
          native-cache-url: ${{ env.CARGO_RAIL_CACHE_URL }}
          native-cache-mode: read-write
          native-cache-credentials-ready: ${{ env.CARGO_RAIL_CACHE_URL == '' || (secrets.CARGO_RAIL_R2_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY != '') }}

      - name: Build named-work planner
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: cargo build --locked --bin cargo-rail

      - name: Create exact plan
        shell: bash
        env:
          CARGO_RAIL_BIN: target/debug/cargo-rail
          RAIL_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/plan/read.py create target/plan-v8.json

      - name: Export plan projections
        id: outputs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "required-work=$(scripts/plan/read.py required target/plan-v8.json)"
            echo "compatibility-matrix=$(scripts/plan/read.py matrix target/plan-v8.json compatibility --family compatibility)"
            echo "filesystem-matrix=$(scripts/plan/read.py matrix target/plan-v8.json compatibility --family filesystem)"
            echo "release-archive-matrix=$(scripts/plan/read.py matrix target/plan-v8.json release-archives)"
            echo "plan-identity=$(scripts/plan/read.py identity target/plan-v8.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-rail-plan-v8
          path: |
            target/plan-v8.json
            target/debug/cargo-rail
          retention-days: 7
          if-no-files-found: error

  quality:
    name: Quality and Security
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'action-pins') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo-command-policy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'installers') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'dependency-policy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.package') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.clippy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'docs.generated') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.doc') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'compiler-fact-driver')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: commit-quality
          install-nextest: "true"
          native-cache-url: ${{ env.CARGO_RAIL_CACHE_URL }}
          native-cache-mode: read-write
          native-cache-credentials-ready: ${{ env.CARGO_RAIL_CACHE_URL == '' || (secrets.CARGO_RAIL_R2_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY != '') }}

      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-rail-plan-v8
          path: target

      - name: Verify checkout against plan
        run: scripts/plan/verify.sh target/plan-v8.json

      - name: Install cargo-deny
        if: contains(fromJSON(needs.plan.outputs.required-work), 'dependency-policy')
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-deny@0.20.2

      - name: Quality checks
        env:
          CARGO_RAIL_PLAN_FILE: target/plan-v8.json
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: just quality-affected

      - name: Exact compiler fact driver
        if: contains(fromJSON(needs.plan.outputs.required-work), 'compiler-fact-driver')
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          rustup component add rustc-dev --toolchain "$RUSTUP_TOOLCHAIN"
          just check-compiler-fact-driver

  cargo:
    name: Build and Test
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.build') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.doctest')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: commit-cargo
          install-nextest: "true"
          native-cache-url: ${{ env.CARGO_RAIL_CACHE_URL }}
          native-cache-mode: read-write
          native-cache-credentials-ready: ${{ env.CARGO_RAIL_CACHE_URL == '' || (secrets.CARGO_RAIL_R2_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY != '') }}

      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-rail-plan-v8
          path: target

      - name: Verify checkout against plan
        run: scripts/plan/verify.sh target/plan-v8.json

      - name: Execute required Cargo work
        env:
          CARGO_RAIL_PLAN_FILE: target/plan-v8.json
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          just build
          just test

  compatibility:
    name: Compatibility
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.required-work), 'compatibility')
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/compatibility.yaml
    with:
      ref: ${{ github.sha }}
      cache-prefix: commit
      compatibility-matrix: ${{ needs.plan.outputs.compatibility-matrix }}
      filesystem-matrix: ${{ needs.plan.outputs.filesystem-matrix }}
      plan-artifact: cargo-rail-plan-v8
      native-cache-url: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CARGO_RAIL_CACHE_REMOTE || '' }}
      native-cache-mode: read-write
    secrets:
      r2_access_key_id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
      r2_secret_access_key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}

  release-archives:
    name: Release Archive Gate
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.required-work), 'release-archives')
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-archives.yaml
    with:
      ref: ${{ github.sha }}
      stage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      selected-matrix: ${{ needs.plan.outputs.release-archive-matrix }}
      plan-artifact: cargo-rail-plan-v8
      native-cache-url: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CARGO_RAIL_CACHE_REMOTE || '' }}
      native-cache-mode: read-write
    secrets:
      r2_access_key_id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
      r2_secret_access_key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}

  surface:
    name: Rust Surface
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.required-work), 'surface')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: commit-surface
          native-cache-url: ${{ env.CARGO_RAIL_CACHE_URL }}
          native-cache-mode: read-write
          native-cache-credentials-ready: ${{ env.CARGO_RAIL_CACHE_URL == '' || (secrets.CARGO_RAIL_R2_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY != '') }}

      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-rail-plan-v8
          path: target

      - name: Verify checkout against plan
        run: scripts/plan/verify.sh target/plan-v8.json

      - name: Enforce planner-selected surface
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          rustup component add rustc-dev --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/with-compiler-fact-driver.sh cargo build --locked \
            --bin cargo-rail --bin cargo-rail-compiler-observation
          target/debug/cargo-rail rail surface --check --format github
