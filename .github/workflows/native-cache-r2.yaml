name: Native Cache R2 Qualification

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/cache/action.yaml"
      - ".github/workflows/native-cache-r2.yaml"
      - "scripts/bench/measure-command.py"
      - "scripts/ci/cleanup-native-cache-r2-prefix.sh"
      - "scripts/ci/qualify-native-cache-s3.sh"
      - "scripts/ci/validate-native-cache-remote-pair.py"
      - "scripts/fixtures/materialize-native-cache.sh"
      - "src/cache/**"
      - "src/compiler/native_cache.rs"
      - "src/remote_cache/**"
      - "src/remote_cache.rs"
      - "tests/fixtures/native_cache/**"
  workflow_dispatch:

concurrency:
  group: native-cache-r2-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  R2_BASE_URL: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
  QUALIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  producer:
    name: Publish verified results
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select disposable R2 authority
        shell: bash
        run: |
          set -euo pipefail
          base="${R2_BASE_URL%/}"
          if [[ ! "$base" =~ ^r2://([0-9a-f]{32})/([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])$ ]]; then
            echo "CARGO_RAIL_CACHE_REMOTE must select one canonical default-jurisdiction R2 bucket root." >&2
            exit 2
          fi
          prefix="cache/cargo-rail/r2/v3/task9/$QUALIFICATION_RUN_ID"
          echo "CARGO_RAIL_CACHE_REMOTE=$base/$prefix" >> "$GITHUB_ENV"

      - name: Install repository Rust toolchain
        run: scripts/ci/install-rust-toolchain.sh

      - name: Install just
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: just@1.58.0

      - name: Build exact cache components
        run: cargo build --package cargo-rail --bins --all-features --release --locked

      - name: Prove authenticated remote readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CARGO_RAIL_CACHE_MODE: read-write
        run: target/release/cargo-rail rail cache probe --format json

      - name: Produce remote cache evidence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CARGO_RAIL_BIN: ${{ github.workspace }}/target/release/cargo-rail
        run: just qualify-native-cache-s3 producer "$QUALIFICATION_RUN_ID" "$CARGO_RAIL_CACHE_REMOTE"

      - name: Upload producer and executable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-r2-producer-${{ env.QUALIFICATION_RUN_ID }}
          path: |
            benchmark_results/native-cache/${{ env.QUALIFICATION_RUN_ID }}-producer
            target/release/cargo-rail
            target/release/cargo-rail-native-rustc-wrapper
            target/release/cargo-rail-native-rustc-worker
          retention-days: 14
          if-no-files-found: error

  consumer:
    name: Restore verified results in a fresh root
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select disposable R2 authority
        shell: bash
        run: |
          set -euo pipefail
          base="${R2_BASE_URL%/}"
          if [[ ! "$base" =~ ^r2://([0-9a-f]{32})/([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])$ ]]; then
            echo "CARGO_RAIL_CACHE_REMOTE must select one canonical default-jurisdiction R2 bucket root." >&2
            exit 2
          fi
          prefix="cache/cargo-rail/r2/v3/task9/$QUALIFICATION_RUN_ID"
          echo "CARGO_RAIL_CACHE_REMOTE=$base/$prefix" >> "$GITHUB_ENV"

      - name: Install repository Rust toolchain
        run: scripts/ci/install-rust-toolchain.sh

      - name: Install just
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: just@1.58.0

      - name: Download exact producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-cache-r2-producer-${{ env.QUALIFICATION_RUN_ID }}
          path: .

      - name: Restore executable modes
        run: chmod 755 target/release/cargo-rail target/release/cargo-rail-native-rustc-wrapper target/release/cargo-rail-native-rustc-worker

      - name: Prove read-only remote readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CARGO_RAIL_CACHE_MODE: read
        run: target/release/cargo-rail rail cache probe --format json

      - name: Consume remote cache evidence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CARGO_RAIL_BIN: ${{ github.workspace }}/target/release/cargo-rail
        run: just qualify-native-cache-s3 consumer "$QUALIFICATION_RUN_ID" "$CARGO_RAIL_CACHE_REMOTE"

      - name: Validate producer and consumer traffic
        run: >-
          just validate-native-cache-remote-pair
          "benchmark_results/native-cache/$QUALIFICATION_RUN_ID-producer"
          "benchmark_results/native-cache/$QUALIFICATION_RUN_ID-consumer"
          "benchmark_results/native-cache/$QUALIFICATION_RUN_ID-pair.json"

      - name: Upload failed consumer evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-r2-consumer-failure-${{ env.QUALIFICATION_RUN_ID }}
          path: benchmark_results/native-cache/${{ env.QUALIFICATION_RUN_ID }}-consumer
          retention-days: 14
          if-no-files-found: warn

      - name: Upload validated cross-root evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-r2-pair-${{ env.QUALIFICATION_RUN_ID }}
          path: |
            benchmark_results/native-cache/${{ env.QUALIFICATION_RUN_ID }}-producer
            benchmark_results/native-cache/${{ env.QUALIFICATION_RUN_ID }}-consumer
            benchmark_results/native-cache/${{ env.QUALIFICATION_RUN_ID }}-pair.json
          retention-days: 14
          if-no-files-found: error

  cleanup:
    name: Remove disposable R2 objects
    needs:
      - producer
      - consumer
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove qualification prefix
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          base="${R2_BASE_URL%/}"
          if [[ ! "$base" =~ ^r2://([0-9a-f]{32})/([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])$ ]]; then
            echo "CARGO_RAIL_CACHE_REMOTE must select one canonical default-jurisdiction R2 bucket root." >&2
            exit 2
          fi
          scripts/ci/cleanup-native-cache-r2-prefix.sh \
            "${BASH_REMATCH[1]}" \
            "${BASH_REMATCH[2]}" \
            "cache/cargo-rail/r2/v3/task9/$QUALIFICATION_RUN_ID"
