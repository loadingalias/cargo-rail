# Release workflow for cargo-rail
#
# Triggered by a version tag created by cargo-rail after its exact commit passed
# the Commit workflow. Reuse those staged, attested archives and build only the
# release-only targets; manual dispatch can recover by rebuilding the full set.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Exact Release Commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.commit-artifacts.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.count }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      commit_run_id: ${{ steps.commit-artifacts.outputs.run_id }}
      reuse_commit_artifacts: ${{ steps.commit-artifacts.outputs.reuse }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Bind authorized tag, commit, and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "Release tag does not resolve to the checked-out commit." >&2
            echo "HEAD=$head_sha tag=$tag_sha" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag does not resolve to the GitHub push event SHA." >&2
            echo "tag=$tag_sha event=$GITHUB_SHA" >&2
            exit 1
          fi
          echo "release_sha=$tag_sha" >> "$GITHUB_OUTPUT"

          test "$(git show -s --format='%(trailers:key=Rail-Release-Publish,valueonly)' "$tag_sha")" = true
          test "$(git show -s --format='%(trailers:key=Rail-Release-Tag,valueonly)' "$tag_sha")" = true
          test "$(git show -s --format='%(trailers:key=Rail-Release-Tag-Name,valueonly)' "$tag_sha")" = "cargo-rail=$RELEASE_TAG"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = manifest["package"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(f"tag v{tag_version} does not match Cargo package version {version}")

          print(f"version={version}")
          PY

      - name: Load supported release targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/support-matrix.py --github-matrix >/dev/null
          jq -e '
            length > 0
            and all(
              .[];
              .target
              and .os
              and (.archive == "tar" or .archive == "zip")
              and (.surface | type == "boolean")
              and (.commit_ci | type == "boolean")
            )
            and ((map(.target) | length) == (map(.target) | unique | length))
          ' \
            distribution/release-targets.json >/dev/null
          echo "count=$(jq 'length' distribution/release-targets.json)" >> "$GITHUB_OUTPUT"

      - name: Reuse exact-SHA Commit archives
        id: commit-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t required < <(
            jq -r '.[] | select(.commit_ci) | "release-\(.target)"' distribution/release-targets.json
          )
          mapfile -t run_ids < <(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow Commit \
              --commit "$RELEASE_SHA" --status success --limit 20 \
              --json conclusion,databaseId,event,headBranch,headSha \
              --jq '.[] | select(.conclusion == "success" and .event == "push" and .headBranch == "main" and .headSha == env.RELEASE_SHA) | .databaseId'
          )

          selected_run=""
          for run_id in "${run_ids[@]}"; do
            mapfile -t available < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | .name'
            )
            missing=false
            for name in "${required[@]}"; do
              if ! printf '%s\n' "${available[@]}" | grep -Fxq "$name"; then
                missing=true
                break
              fi
            done
            if [ "$missing" = false ]; then
              selected_run="$run_id"
              break
            fi
          done

          if [ -n "$selected_run" ]; then
            {
              echo "reuse=true"
              echo "run_id=$selected_run"
              echo "matrix=$(jq -c '{include: map(select(.commit_ci | not))}' distribution/release-targets.json)"
            } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Exact-SHA Commit artifacts are unavailable; rebuilding every archive for recovery."
            {
              echo "reuse=false"
              echo "run_id="
              echo "matrix=$(jq -c '{include: .}' distribution/release-targets.json)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No successful exact-SHA Commit run retains the required release archives." >&2
            exit 1
          fi

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "GitHub Release $RELEASE_TAG not visible yet; retrying ($attempt/24)..."
            sleep 5
          done
          echo "GitHub Release $RELEASE_TAG was not created by cargo-rail in time." >&2
          exit 1

  upload-assets:
    name: Build and Verify Release Archives
    needs: verify-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-archives.yaml
    with:
      ref: ${{ needs.verify-release.outputs.release_sha }}
      stage: true
      selected-matrix: ${{ needs.verify-release.outputs.matrix }}
      native-cache-url: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
      native-cache-mode: read-write
    secrets:
      r2_access_key_id: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}

  publish-checksums:
    name: Verify and Publish Release Manifests
    needs: [verify-release, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.release_sha }}

      - name: Collect release-only or recovery archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true

      - name: Collect exact-SHA Commit archives
        if: needs.verify-release.outputs.reuse_commit_artifacts == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.commit_run_id }}

      - name: Verify archive set
        env:
          EXPECTED_ARCHIVES: ${{ needs.verify-release.outputs.target_count }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cargo-rail-*.tar.* cargo-rail-*.zip)
          if [ "${#files[@]}" -ne "$EXPECTED_ARCHIVES" ]; then
            echo "Expected $EXPECTED_ARCHIVES release archives, found ${#files[@]}." >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

      - name: Prepare versioned installers
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib

          replacements = {
              "@CARGO_RAIL_VERSION@": os.environ["VERSION"],
          }
          installers = {
              pathlib.Path("scripts/install.sh"): pathlib.Path("cargo-rail-installer.sh"),
              pathlib.Path("scripts/install.ps1"): pathlib.Path("cargo-rail-installer.ps1"),
          }
          for source, destination in installers.items():
              content = source.read_text()
              for placeholder, value in replacements.items():
                  if content.count(placeholder) != 1:
                      raise SystemExit(f"{source} must contain exactly one {placeholder} placeholder")
                  content = content.replace(placeholder, value)
              destination.write_text(content)
          PY
          chmod 755 cargo-rail-installer.sh
          sh -n cargo-rail-installer.sh
          if grep -Fq '@CARGO_RAIL_VERSION@' cargo-rail-installer.sh cargo-rail-installer.ps1; then
            echo "release installer still contains a version placeholder" >&2
            exit 1
          fi

      - name: Verify PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "cargo-rail-installer.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { [Console]::Error.WriteLine($_) }
            exit 1
          }

      - name: Generate checksum manifests
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cargo-rail-*.tar.* cargo-rail-*.zip cargo-rail-installer.sh cargo-rail-installer.ps1)
          sha256sum "${files[@]}" | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS

          python3 - <<'PY'
          import json
          import os
          import pathlib

          entries = []
          for line in pathlib.Path("SHA256SUMS").read_text().splitlines():
              digest, filename = line.split(maxsplit=1)
              entries.append({"file": filename.lstrip("*").strip(), "sha256": digest})

          payload = {
              "tool": "cargo-rail",
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["RELEASE_SHA"],
              "entries": entries,
          }
          pathlib.Path("SHA256SUMS.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Verify archive provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cargo-rail-*.tar.* cargo-rail-*.zip)
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cargo-rail-*.tar.* cargo-rail-*.zip)
          files+=(cargo-rail-installer.sh cargo-rail-installer.ps1 SHA256SUMS SHA256SUMS.json)
          remote_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          missing=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if grep -Fxq "$name" <<< "$remote_assets"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$download_dir"
              if ! cmp -s "$file" "$download_dir/$name"; then
                echo "Release asset $name already exists with different bytes." >&2
                exit 1
              fi
              echo "Verified existing immutable asset: $name"
            else
              missing+=("$file")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${missing[@]}"
          fi
