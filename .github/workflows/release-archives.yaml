name: Release Archives

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to package
        required: true
        type: string
      stage:
        description: Attest and stage verified archives for release publication
        required: false
        default: false
        type: boolean
      selected-matrix:
        description: Planner-selected archive matrix or explicit all
        required: false
        default: "all"
        type: string
      plan-artifact:
        description: Exact v8 plan artifact to verify before execution
        required: false
        default: ""
        type: string
      native-cache-url:
        description: Machine-owned Cargo-Rail remote cache URL
        required: false
        default: ""
        type: string
      native-cache-mode:
        description: Cargo-Rail remote authority
        required: false
        default: read
        type: string
    secrets:
      r2_access_key_id:
        description: Bucket-scoped Cloudflare R2 access key ID
        required: false
      r2_secret_access_key:
        description: Bucket-scoped Cloudflare R2 secret access key
        required: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare Release Archive Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.package.outputs.version }}
      msrv: ${{ steps.package.outputs.msrv }}
      release_sha: ${{ steps.package.outputs.release_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Download exact plan
        if: inputs.plan-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: target

      - name: Verify checkout against plan
        if: inputs.plan-artifact != ''
        run: scripts/plan/verify.sh target/plan-v8.json

      - name: Bind package identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(f"version={manifest['package']['version']}")
          print(f"msrv={manifest['workspace']['package']['rust-version']}")
          PY

      - name: Load supported release targets
        id: targets
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          SELECTED_MATRIX: ${{ inputs.selected-matrix }}
        run: |
          set -euo pipefail
          python3 scripts/ci/support-matrix.py --github-matrix >/dev/null
          jq -e '
            length > 0
            and all(
              .[];
              .target
              and .os
              and (.archive == "tar" or .archive == "zip")
              and (.surface | type == "boolean")
              and (.commit_ci | type == "boolean")
            )
            and ((map(.target) | length) == (map(.target) | unique | length))
          ' distribution/release-targets.json >/dev/null
          if [ "$SELECTED_MATRIX" = all ]; then
            matrix="$(
              jq -c --arg stage "$STAGE" \
                '{include: (if $stage == "true" then . else map(select(.commit_ci)) end)}' \
                distribution/release-targets.json
            )"
          else
            matrix="$SELECTED_MATRIX"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Verify (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Verify checkout identity
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Install Rust
        shell: bash
        env:
          TOOLCHAIN: ${{ needs.prepare.outputs.msrv }}
        run: scripts/ci/install-rust-toolchain.sh --toolchain "$TOOLCHAIN"

      - name: Setup Cargo and compiler caches
        uses: ./.github/actions/cache
        with:
          shared-key: cargo-rail-release-archives-v2
          cache-key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          remote-url: ${{ inputs.native-cache-url }}
          remote-mode: ${{ inputs.native-cache-mode }}
          remote-access-key-id: ${{ inputs.native-cache-url != '' && secrets.r2_access_key_id || '' }}
          remote-secret-access-key: ${{ inputs.native-cache-url != '' && secrets.r2_secret_access_key || '' }}

      - name: Download exact plan
        if: inputs.plan-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: target

      - name: Verify checkout against plan
        if: inputs.plan-artifact != ''
        run: scripts/plan/verify.sh target/plan-v8.json

      - name: Bind GNU runtime floor
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/ci/verify-gnu-runtime.py --target "$TARGET" --host-only

      - name: Setup target toolchain
        if: ${{ !contains(matrix.target, '-linux-musl') }}
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: Install pinned native musl toolchain
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/install-musl-toolchain.sh "$TARGET" "$GITHUB_ENV"

      - name: Select exact native musl Rust host
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ needs.prepare.outputs.msrv }}
        run: >-
          scripts/ci/install-rust-toolchain.sh
          --toolchain "$TOOLCHAIN"
          --host "$TARGET"
          --components rustc-dev

      - name: Manufacture exact compiler fact driver
        id: fact-driver
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          AWS_ACCESS_KEY_ID: ${{ inputs.native-cache-url != '' && secrets.r2_access_key_id || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.native-cache-url != '' && secrets.r2_secret_access_key || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.surface }}" != "true" ]]; then
            echo "include=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci/manufacture-compiler-fact-driver.sh "$TARGET" "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Configure path remapping
        shell: bash
        run: |
          flags="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace --remap-path-scope=object"
          if [ -n "${RUSTFLAGS:-}" ]; then
            flags="${RUSTFLAGS} ${flags}"
          fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Configure static linking (musl)
        if: contains(matrix.target, '-linux-musl')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static -C link-self-contained=yes" >> "$GITHUB_ENV"

      - name: Configure static linking (Windows)
        if: contains(matrix.target, '-windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build archive
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.native-cache-url != '' && secrets.r2_access_key_id || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.native-cache-url != '' && secrets.r2_secret_access_key || '' }}
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          bin: cargo-rail,cargo-rail-compiler-observation,cargo-rail-native-rustc-wrapper,cargo-rail-native-rustc-worker,cargo-rail-distributed-worker
          archive: cargo-rail-${{ matrix.target }}
          target: ${{ matrix.target }}
          locked: true
          tar: unix
          zip: windows
          dry-run: true
          dry-run-intended: true
          include: ${{ steps.fact-driver.outputs.include }}

      - name: Bind archive component inventory
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive == 'zip' && steps.build.outputs.zip || steps.build.outputs.tar }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package-release-archive.py "$ARCHIVE" \
            --target "$TARGET" \
            --version "$VERSION" \
            --surface "${{ matrix.surface }}"

      - name: Smoke-test tar archive
        if: matrix.archive == 'tar'
        shell: bash
        env:
          ARCHIVE: ${{ steps.build.outputs.tar }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/ci/smoke-release-tar.sh "$ARCHIVE" "$TARGET" "$VERSION" "${{ matrix.surface }}"

      - name: Smoke-test zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.build.outputs.zip }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:ARCHIVE -or -not (Test-Path $env:ARCHIVE)) {
            throw "release archive was not produced"
          }
          Expand-Archive -Path $env:ARCHIVE -DestinationPath smoke
          $binary = Get-ChildItem smoke -Recurse -Filter cargo-rail.exe | Select-Object -First 1
          $observation = Get-ChildItem smoke -Recurse -Filter cargo-rail-compiler-observation.exe | Select-Object -First 1
          $wrapper = Get-ChildItem smoke -Recurse -Filter cargo-rail-native-rustc-wrapper.exe | Select-Object -First 1
          $worker = Get-ChildItem smoke -Recurse -Filter cargo-rail-native-rustc-worker.exe | Select-Object -First 1
          $distributedWorker = Get-ChildItem smoke -Recurse -Filter cargo-rail-distributed-worker.exe | Select-Object -First 1
          $driver = Get-ChildItem smoke -Recurse -Filter cargo-rail-fact-driver.exe | Select-Object -First 1
          $driverSource = Get-ChildItem smoke -Recurse -Filter cargo-rail-fact-driver-source-v1.json | Select-Object -First 1
          $componentManifest = Get-ChildItem smoke -Recurse -Filter cargo-rail-components-v1.tsv | Select-Object -First 1
          if (-not $binary) {
            throw "cargo-rail.exe is missing from $env:ARCHIVE"
          }
          if (-not $observation) {
            throw "cargo-rail-compiler-observation.exe is missing from $env:ARCHIVE"
          }
          if (-not $wrapper) {
            throw "cargo-rail-native-rustc-wrapper.exe is missing from $env:ARCHIVE"
          }
          if (-not $worker) {
            throw "cargo-rail-native-rustc-worker.exe is missing from $env:ARCHIVE"
          }
          if (-not $distributedWorker) {
            throw "cargo-rail-distributed-worker.exe is missing from $env:ARCHIVE"
          }
          if (-not $driver) {
            throw "cargo-rail-fact-driver.exe is missing from $env:ARCHIVE"
          }
          if (-not $driverSource -or -not $componentManifest) {
            throw "Surface source authority or component manifest is missing from $env:ARCHIVE"
          }
          if ($binary.DirectoryName -ne $observation.DirectoryName -or $binary.DirectoryName -ne $wrapper.DirectoryName -or $binary.DirectoryName -ne $worker.DirectoryName -or $binary.DirectoryName -ne $distributedWorker.DirectoryName -or $binary.DirectoryName -ne $driver.DirectoryName -or $binary.DirectoryName -ne $driverSource.DirectoryName -or $binary.DirectoryName -ne $componentManifest.DirectoryName) {
            throw "cargo-rail compiler cache binaries are not adjacent to cargo-rail.exe"
          }
          python scripts/ci/verify-release-components.py $binary.DirectoryName --target "${{ matrix.target }}" --version $env:VERSION --surface "true"
          if ($LASTEXITCODE -ne 0) {
            throw "archive component authority verification failed"
          }
          $observationProtocol = (& $observation.FullName --cargo-rail-observation-protocol-version).Trim()
          if ($LASTEXITCODE -ne 0 -or $observationProtocol -ne '1') {
            throw "archive compiler observation protocol smoke test failed"
          }
          python scripts/ci/verify-distributed-worker.py --worker $distributedWorker.FullName --rustc rustc
          if ($LASTEXITCODE -ne 0) {
            throw "archive distributed worker capability smoke test failed"
          }
          $sysroot = (& rustc --print sysroot).Trim()
          $compilerLibrary = Join-Path $sysroot ($env:CARGO_RAIL_FACT_DRIVER_COMPILER_LIBRARY -replace '/', '\')
          $env:PATH = "$(Split-Path $compilerLibrary);$env:PATH"
          $protocol = (& $driver.FullName --cargo-rail-fact-protocol-version).Trim()
          if ($LASTEXITCODE -ne 0 -or $protocol -notmatch '^[1-9][0-9]*$') {
            throw "archive compiler fact driver failed to load: $protocol"
          }
          rustup component remove rustc-dev
          if ($LASTEXITCODE -ne 0) {
            Write-Host "selected rustc-dev was already absent"
          }
          Push-Location tests/fixtures/surface_release
          $preparationJson = & $binary.FullName rail surface --prepare -f json
          if ($LASTEXITCODE -ne 0) {
            throw "archive Surface preparation failed"
          }
          $preparation = $preparationJson | Out-String | ConvertFrom-Json
          Pop-Location
          if ($preparation.mode -ne 'prepare' -or $preparation.result -ne 'ready' -or $preparation.surface_preparation_contract_version -ne 1 -or $preparation.driver.identity -notmatch '^compiler-fact-driver-v1-sha256-[0-9a-f]{64}$') {
            throw "archive Surface preparation contract is invalid"
          }
          # Readiness and the following analysis prove the compiler capability. The required
          # library may be supplied by rustc itself or by the rustc-dev component.
          Push-Location tests/fixtures/surface_release
          $PSNativeCommandUseErrorActionPreference = $false
          $surfaceJson = & $binary.FullName rail surface --check -f json
          $surfaceExit = $LASTEXITCODE
          $surfaceReport = $surfaceJson | Out-String | ConvertFrom-Json
          Pop-Location
          if ($surfaceExit -ne 1 -or $surfaceReport.surface_contract_version -ne 3) {
            throw "archive surface fixture did not report its versioned findings"
          }
          if ($surfaceReport.authority.audited_targets.Count -eq 0) {
            throw "archive surface fixture did not audit a closed compiler target"
          }
          if (-not ($surfaceReport.findings | Where-Object { $_.name -eq "dead_public" })) {
            throw "archive surface fixture did not report dead_public"
          }
          $nightlyToolchain = "nightly-2026-08-12"
          rustup toolchain install $nightlyToolchain --profile minimal
          if ($LASTEXITCODE -ne 0) {
            throw "dated nightly toolchain installation failed"
          }
          rustup component remove rustc-dev --toolchain $nightlyToolchain 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "dated nightly rustc-dev was already absent"
          }
          $env:RUSTUP_TOOLCHAIN = $nightlyToolchain
          $env:CARGO = (rustup which cargo --toolchain $nightlyToolchain).Trim()
          $env:RUSTC = (rustup which rustc --toolchain $nightlyToolchain).Trim()
          $env:RUSTDOC = (rustup which rustdoc --toolchain $nightlyToolchain).Trim()
          Push-Location tests/fixtures/surface_release
          $nightlyPreparationJson = & $binary.FullName rail surface --prepare -f json
          $nightlyPreparationExit = $LASTEXITCODE
          $nightlyPreparation = $nightlyPreparationJson | Out-String | ConvertFrom-Json
          Pop-Location
          if ($nightlyPreparationExit -ne 0) {
            throw "archive dated-nightly Surface preparation failed: $($nightlyPreparationJson | Out-String)"
          }
          if ($nightlyPreparation.mode -ne 'prepare' -or $nightlyPreparation.result -ne 'ready' -or $nightlyPreparation.surface_preparation_contract_version -ne 1 -or $nightlyPreparation.toolchain.rustc -notmatch '1\.99\.0-nightly') {
            throw "archive dated-nightly Surface preparation contract is invalid: $($nightlyPreparationJson | Out-String)"
          }
          Push-Location tests/fixtures/surface_release
          $nightlyJson = & $binary.FullName rail surface --check -f json
          $nightlyExit = $LASTEXITCODE
          $nightlyReport = $nightlyJson | Out-String | ConvertFrom-Json
          Pop-Location
          Remove-Item Env:RUSTUP_TOOLCHAIN, Env:CARGO, Env:RUSTC, Env:RUSTDOC
          if ($nightlyExit -ne 1 -or $nightlyReport.surface_contract_version -ne 3 -or $nightlyReport.toolchain.rustc -notmatch '1\.99\.0-nightly' -or $nightlyReport.authority.audited_targets.Count -eq 0) {
            throw "archive dated-nightly Surface qualification failed"
          }
          $actual = (& $binary.FullName rail --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne "cargo-rail $env:VERSION") {
            throw "archive smoke test failed: $actual"
          }

      - name: Attest archive provenance
        if: inputs.stage
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ matrix.archive == 'zip' && steps.build.outputs.zip || steps.build.outputs.tar }}

      - name: Stage verified archive
        if: inputs.stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.archive == 'zip' && steps.build.outputs.zip || steps.build.outputs.tar }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
