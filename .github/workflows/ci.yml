name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: runs-on=${{ github.run_id }}/runner=x86_64-linux/env=production
            timeout: 45
          - platform: aarch64-linux
            runner: runs-on=${{ github.run_id }}/runner=aarch64-linux/env=production
            timeout: 45
          - platform: x86_64-win
            runner: runs-on=${{ github.run_id }}/runner=x86_64-win/env=production
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      AWS_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/tooling/"$PLATFORM".sh ci
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tooling/check.ps1
      - name: Install Windows tooling
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tooling/x86_64-win.ps1 -Operation ci
      # Cache setup changes Cargo configuration, so planning must capture it afterward.
      - uses: loadingalias/cargo-rail-action/cache@e706767c343acb6a2ab1917f243b1616ae9eb05b # v10.0.0
        if: github.event_name != 'pull_request'
        id: cache
        with:
          remote: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
          mode: read-write
          max-size: 10GiB
          root-portability: remap
          verify-remote: true
      - uses: loadingalias/cargo-rail-action@e706767c343acb6a2ab1917f243b1616ae9eb05b # v10.0.0
        id: rail
        with:
          all: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Check tooling and workflows
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'check-tooling')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" check-tooling)" == true ]]
          just check-tooling
      - name: Check formatting
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'cargo.fmt')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.fmt)" == true ]]
          just check-format
      - name: Check dependency policy
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'dependency-policy')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" dependency-policy)" == true ]]
          just check-dependencies
      - name: Build
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.build')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.build)" == true ]]
          just build
      - name: Check Clippy
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.clippy')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.clippy)" == true ]]
          just check-clippy
      - name: Check documentation
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.doc')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.doc)" == true ]]
          just check-docs
      - name: Check compiler driver
        if: contains(fromJSON(steps.rail.outputs.required-work), 'check-compiler-driver')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" check-compiler-driver)" == true ]]
          just check-compiler-driver
      - name: Test
        if: (contains(fromJSON(steps.rail.outputs.required-work), 'cargo.test') || contains(fromJSON(steps.rail.outputs.required-work), 'cargo.doctest'))
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          cargo-rail rail plan --verify "$PLAN_FILE"
          just test
          cargo-rail rail plan --verify "$PLAN_FILE"
      - name: Check worktree
        if: always()
        run: |
          git diff --exit-code HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - uses: loadingalias/cargo-rail-action/cache/collect@e706767c343acb6a2ab1917f243b1616ae9eb05b # v10.0.0
        if: always() && github.event_name != 'pull_request' && steps.cache.outcome == 'success'
        id: cache-record
        with:
          job: ${{ matrix.platform }}
          output-directory: ${{ runner.temp }}/cache-records
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.cache-record.outcome == 'success'
        with:
          name: cache-record-${{ matrix.platform }}
          path: ${{ steps.cache-record.outputs.record-file }}
          if-no-files-found: error

  extended:
    # Hosts without release archives build Cargo-Rail from source and run the complete lane, plus native
    # cache qualification, on every event that can gate a release. Release validation dispatches this workflow.
    if: github.event_name != 'pull_request'
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: s390x-linux
            runner: ubuntu-24.04-s390x
            timeout: 240
          - platform: powerpc64le-linux
            runner: ubuntu-24.04-ppc64le-p10
            timeout: 240
          - platform: riscv64-linux
            runner: ubuntu-24.04-riscv
            timeout: 360
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux tooling
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/tooling/"$PLATFORM".sh ci
      - name: Check Clippy
        run: just check-clippy
      - name: Check documentation
        run: just check-docs
      - name: Check compiler driver
        run: just check-compiler-driver
      - name: Test
        run: just test
      - name: Qualify native cache
        run: scripts/check-cache-host.sh
      - name: Check worktree
        if: always()
        run: |
          git diff --exit-code HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  cache-report:
    name: Compiler cache report
    needs: [native]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: cache-record-*
          merge-multiple: true
          path: ${{ runner.temp }}/cache-records
      - uses: loadingalias/cargo-rail-action/cache/report@e706767c343acb6a2ab1917f243b1616ae9eb05b # v10.0.0
        with:
          records-directory: ${{ runner.temp }}/cache-records
          expected-jobs: '["x86_64-linux", "aarch64-linux", "x86_64-win"]'
