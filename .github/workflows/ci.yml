name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request replaces its older run. Each commit on main keeps its own run, so the hours-long
# IBM and RISC-V lanes finish for every commit that release validation may select.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: runs-on=${{ github.run_id }}/runner=x86_64-linux/env=production
            timeout: 45
          - platform: aarch64-linux
            runner: runs-on=${{ github.run_id }}/runner=aarch64-linux/env=production
            timeout: 45
          - platform: x86_64-win
            runner: runs-on=${{ github.run_id }}/runner=x86_64-win/env=production
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      AWS_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.CARGO_RAIL_R2_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ github.token }} # Authenticates cargo-binstall's GitHub API lookups.
        run: scripts/tooling/"$PLATFORM".sh ci
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tooling/check.ps1
      - name: Install Windows tooling
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }} # Authenticates cargo-binstall's GitHub API lookups.
        run: ./scripts/tooling/x86_64-win.ps1 -Operation ci
      # Cache setup changes Cargo configuration, so planning must capture it afterward.
      - uses: loadingalias/cargo-rail-action/cache@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        if: github.event_name != 'pull_request'
        id: cache
        with:
          remote: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
          mode: read-write
          max-size: 10GiB
          root-portability: remap
          verify-remote: true
      - uses: loadingalias/cargo-rail-action@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        id: rail
        with:
          all: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Check tooling and workflows
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'check-tooling')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" check-tooling)" == true ]]
          just check-tooling
      - name: Check formatting
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'cargo.fmt')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.fmt)" == true ]]
          just check-format
      - name: Check dependency policy
        if: matrix.platform == 'x86_64-linux' && contains(fromJSON(steps.rail.outputs.required-work), 'dependency-policy')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" dependency-policy)" == true ]]
          just check-dependencies
      - name: Build
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.build')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.build)" == true ]]
          just build
      - name: Check Clippy
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.clippy')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.clippy)" == true ]]
          just check-clippy
      - name: Check documentation
        if: contains(fromJSON(steps.rail.outputs.required-work), 'cargo.doc')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" cargo.doc)" == true ]]
          just check-docs
      - name: Check compiler driver
        if: contains(fromJSON(steps.rail.outputs.required-work), 'check-compiler-driver')
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          [[ "$(cargo-rail-action plan is-required "$PLAN_FILE" check-compiler-driver)" == true ]]
          just check-compiler-driver
      # Temporary: find why direct saved-plan verification rejects the Action's plan on Windows.
      - name: Diagnose saved-plan verification
        if: runner.os == 'Windows' && (contains(fromJSON(steps.rail.outputs.required-work), 'cargo.test') || contains(fromJSON(steps.rail.outputs.required-work), 'cargo.doctest'))
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          set +e
          # Verification passed when cargo-rail was resolved from a directory first on PATH (probe and Action)
          # and failed when launched by path. Capture the identity preimage from three launches.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/cargo/resolution.rs')
          source = path.read_text()
          anchor = '            &config.portable_snapshot_identity(source_root)?,\n        );\n        Ok(identity)'
          assert source.count(anchor) == 1
          debug = (
              'if let Some(directory) = std::env::var_os("RAIL_DEBUG_PLANNING_IDENTITY") {\n'
              '            let _ = std::fs::write(std::path::Path::new(&directory).join(format!("{}.txt", std::process::id())), String::from_utf8_lossy(&identity).escape_debug().to_string());\n'
              '        }\n        Ok(identity)'
          )
          path.write_text(source.replace(anchor, anchor.replace('Ok(identity)', debug)))
          PY
          source target/debug/compiler-driver-authority.env
          cargo build --bin cargo-rail --all-features --locked 2>&1 | tail -1
          diag="$RUNNER_TEMP/rail-diag"
          mkdir -p "$diag/bin" "$diag/out"
          cp target/debug/cargo-rail.exe "$diag/bin/cargo-rail.exe"
          git checkout -- src/cargo/resolution.rs
          RAIL_DEBUG_PLANNING_IDENTITY="$(cygpath -w "$diag/out")"
          export RAIL_DEBUG_PLANNING_IDENTITY
          capture() {
            local label="$1"; shift
            "$@" < "$PLAN_FILE"; echo "$label rc=$?"
            mv "$diag"/out/*.txt "$diag/$label.txt"
          }
          capture by-path "$diag/bin/cargo-rail.exe" rail plan --verify -
          PATH="$diag/bin:$PATH" capture on-path cargo-rail rail plan --verify -
          PATH="$diag/bin:$PATH" capture action cargo-rail-action plan is-required "$PLAN_FILE" cargo.test
          python3 - "$diag" <<'PY'
          import difflib, re, sys
          from pathlib import Path
          def tokens(label):
              path = Path(sys.argv[1], f'{label}.txt')
              if not path.exists():
                  print(f'== {label}: no preimage captured')
                  return []
              text = path.read_text(encoding='utf-8', errors='replace')
              return [token for token in re.split(r'(?:\\0|\\u\{[0-9a-f]+\}|\\[tnr])+|,', text) if token]
          by_path, on_path, action = tokens('by-path'), tokens('on-path'), tokens('action')
          print('== by-path preimage')
          [print('  ' + token) for token in by_path]
          for label, other in (('on-path', on_path), ('action', action)):
              print(f'== preimage difference: by-path vs {label}')
              for line in difflib.unified_diff(by_path, other, 'by-path', label, n=2, lineterm=''):
                  print('  ' + line)
          PY
      - name: Test
        if: (contains(fromJSON(steps.rail.outputs.required-work), 'cargo.test') || contains(fromJSON(steps.rail.outputs.required-work), 'cargo.doctest'))
        env:
          PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        run: |
          cargo-rail rail plan --verify "$PLAN_FILE"
          just test
          cargo-rail rail plan --verify "$PLAN_FILE"
      - name: Check worktree
        if: always()
        run: |
          git diff --exit-code HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - uses: loadingalias/cargo-rail-action/cache/collect@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        if: always() && github.event_name != 'pull_request' && steps.cache.outcome == 'success'
        id: cache-record
        with:
          job: ${{ matrix.platform }}
          output-directory: ${{ runner.temp }}/cache-records
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.cache-record.outcome == 'success'
        with:
          name: cache-record-${{ matrix.platform }}
          path: ${{ steps.cache-record.outputs.record-file }}
          if-no-files-found: error

  compiler-channels:
    # `cache ready` builds the compiler driver for the project's own toolchain, so every current channel must
    # build and pass it. This job runs on every commit because a new nightly can break it without a change here.
    name: Compiler driver on ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, nightly]
    runs-on: runs-on=${{ github.run_id }}-driver-${{ matrix.channel }}/runner=x86_64-linux/env=production
    timeout-minutes: 45
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux tooling
        env:
          GITHUB_TOKEN: ${{ github.token }} # Authenticates cargo-binstall's GitHub API lookups.
        run: scripts/tooling/x86_64-linux.sh ci
      - name: Install the current ${{ matrix.channel }} compiler
        run: rustup toolchain install "$CHANNEL" --profile minimal --component rustc-dev
      - name: Check compiler driver
        run: just check-compiler-driver-channel "$CHANNEL"
      - name: Check worktree
        if: always()
        run: |
          git diff --exit-code HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  extended-build:
    # IBM Z, IBM POWER, and RISC-V runners only execute. x86-64 cross-builds each one's optimized test archive,
    # with its compiler driver and source-installation CLI, and the runner's cargo-nextest,
    # and runs its Clippy and documentation checks.
    if: github.event_name != 'pull_request'
    name: Prepare ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: s390x-linux
            target: s390x-unknown-linux-gnu
          - platform: powerpc64le-linux
            target: powerpc64le-unknown-linux-gnu
          - platform: riscv64-linux
            target: riscv64gc-unknown-linux-gnu
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.platform }}/runner=x86_64-linux/env=production
    timeout-minutes: 90
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build tooling
        env:
          GITHUB_TOKEN: ${{ github.token }} # Authenticates cargo-binstall's GitHub API lookups.
        run: scripts/tooling/x86_64-linux.sh cross-build "$PLATFORM"
      - uses: loadingalias/cargo-rail-action/cache@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        with:
          remote: ${{ vars.CARGO_RAIL_CACHE_REMOTE }}
          mode: read-write
          max-size: 10GiB
          root-portability: remap
          verify-remote: true
      - name: Check Clippy and documentation
        run: scripts/check-cache-host.sh check "$TARGET"
      - name: Build the test archive
        run: scripts/check-cache-host.sh prepare "$TARGET" "$RUNNER_TEMP/tests-archive"
      - name: Build the runner's cargo-nextest
        run: scripts/check-cache-host.sh runner-tools "$TARGET" "$RUNNER_TEMP/runner-tools"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}
          path: ${{ runner.temp }}/tests-archive/*
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-tools-${{ matrix.platform }}
          path: ${{ runner.temp }}/runner-tools/bin/cargo-nextest
          if-no-files-found: error
          retention-days: 2

  extended:
    # Each runner proves native caching on its real architecture: it builds and tests the compiler driver,
    # then runs the library and cache suites from the archive built for it, including every required
    # qualification case. Architecture-independent suites run on x86-64, arm64, and Windows.
    # Release validation dispatches this workflow.
    needs: extended-build
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: s390x-linux
            runner: ubuntu-24.04-s390x
          - platform: powerpc64le-linux
            runner: ubuntu-24.04-ppc64le-p10
          - platform: riscv64-linux
            runner: ubuntu-24.04-riscv
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tests-${{ matrix.platform }}
          path: ${{ runner.temp }}/tests-archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-tools-${{ matrix.platform }}
          path: ${{ runner.temp }}/runner-tools
      # Tests run Cargo, rustc, and Clippy against the exact native compiler; the driver builds with rustc-dev.
      - name: Install cache-host tooling
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/tooling/"$PLATFORM".sh cache-host
      - name: Install the cross-built cargo-nextest
        run: |
          chmod 755 "$RUNNER_TEMP/runner-tools/cargo-nextest"
          printf '%s\n' "$RUNNER_TEMP/runner-tools" >> "$GITHUB_PATH"
      - name: Build and test the compiler driver
        run: scripts/check-compiler-fact-driver.sh --channel "$RUSTUP_TOOLCHAIN"
      - name: Test native caching
        run: scripts/check-cache-host.sh run-suite "$RUNNER_TEMP/tests-archive"
      - name: Check worktree
        if: always()
        run: |
          git diff --exit-code HEAD
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  cache-report:
    name: Compiler cache report
    needs: [native]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: cache-record-*
          merge-multiple: true
          path: ${{ runner.temp }}/cache-records
      - uses: loadingalias/cargo-rail-action/cache/report@4d7bebe671430eee0db376de3f943d8de26e78de # v10.1.0
        with:
          records-directory: ${{ runner.temp }}/cache-records
          expected-jobs: '["x86_64-linux", "aarch64-linux", "x86_64-win"]'
