name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: x86_64-linux
            runner: runs-on=${{ github.run_id }}/runner=x86_64-linux/image=ubuntu24-full-x64/spot=false/env=production
            suite: full
            timeout: 45
          - platform: aarch64-linux
            runner: runs-on=${{ github.run_id }}/runner=aarch64-linux/image=ubuntu24-full-arm64/spot=false/env=production
            suite: full
            timeout: 45
          - platform: x86_64-win
            runner: runs-on=${{ github.run_id }}/runner=x86_64-win/spot=false/env=production
            suite: full
            timeout: 60
          - platform: s390x-linux
            runner: ubuntu-24.04-s390x
            suite: cache
            timeout: 90
          - platform: powerpc64le-linux
            runner: ubuntu-24.04-ppc64le-p10
            suite: cache
            timeout: 90
          - platform: riscv64-linux
            runner: ubuntu-24.04-riscv
            suite: cache
            timeout: 120
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/tooling/"$PLATFORM".sh
      - name: Install Windows tooling
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tooling/x86_64-win.ps1
      - name: Check
        if: matrix.suite == 'full'
        run: just ci-check check-compiler-driver
      - name: Test
        if: matrix.suite == 'full'
        run: scripts/check-native-tests.sh
      - name: Qualify native cache
        if: matrix.suite == 'cache'
        run: scripts/check-cache-host.sh
      - name: Check worktree
        run: git diff --exit-code HEAD
