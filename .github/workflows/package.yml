name: Release packages
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 24.04 build host preserves the Action's glibc 2.39 baseline.
          - runner: runs-on=${{ github.run_id }}/runner=x86_64-linux/env=production
            target: x86_64-unknown-linux-gnu
            timeout: 30
          - runner: runs-on=${{ github.run_id }}/runner=aarch64-linux/env=production
            target: aarch64-unknown-linux-gnu
            timeout: 30
          - runner: runs-on=${{ github.run_id }}/runner=x86_64-win/env=production
            target: x86_64-pc-windows-msvc
            timeout: 60
          - runner: macos-15
            target: aarch64-apple-darwin
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Windows tooling and package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -Operation package
          just package-release "$env:RUNNER_TEMP/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install native release tooling
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/tooling/package-unix.sh "$TARGET"
      - name: Package native release
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "$TARGET" ]]
          just package-release "$RUNNER_TEMP/release"
      - name: Test release packaging
        run: python3 -B -m unittest discover -s scripts/tooling -p 'test_package_release.py' -v
      - name: Verify prebuilt installation without source fallback
        run: python3 scripts/check-release-install.py "$RUNNER_TEMP/release"
      - name: Require unchanged sources
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  collect:
    name: Collect release assets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Mint the Sigstore signing certificate.
      attestations: write # Persist the signed provenance.
      artifact-metadata: write # Record the attested artifact subjects.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Collect authenticated component archives
        run: |
          mkdir "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP"/packages/*/*.zip "$RUNNER_TEMP/assets/"
          cat "$RUNNER_TEMP"/packages/*/SHA256SUMS | sort > "$RUNNER_TEMP/assets/SHA256SUMS"
          cp LICENSE "$RUNNER_TEMP/assets/LICENSE"
          (cd "$RUNNER_TEMP/assets"; sha256sum --check --strict SHA256SUMS)
      - name: Attest component archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/cargo-rail-*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cargo-rail-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
