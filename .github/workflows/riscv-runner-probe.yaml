name: RISE RISC-V Runner Probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: RISE runner label to probe
        required: true
        default: ubuntu-26.04-riscv
        type: choice
        options:
          - ubuntu-26.04-riscv
          - ubuntu-24.04-riscv

permissions: {}

jobs:
  probe:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Verify advertised runner
        shell: bash
        env:
          SELECTED_RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          online_cpus="$(getconf _NPROCESSORS_ONLN)"
          source /etc/os-release

          case "$SELECTED_RUNNER" in
            ubuntu-26.04-riscv)
              expected_os=26.04
              minimum_cpus=8
              ;;
            ubuntu-24.04-riscv)
              expected_os=24.04
              minimum_cpus=4
              ;;
            *)
              printf 'unexpected runner label: %s\n' "$SELECTED_RUNNER" >&2
              exit 1
              ;;
          esac

          printf 'architecture=%s\n' "$architecture"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unset}"
          printf 'os=%s %s\n' "$NAME" "$VERSION_ID"
          printf 'online_cpus=%s\n' "$online_cpus"

          test "$architecture" = riscv64
          test "${RUNNER_ARCH:-}" = RISCV64
          test "$VERSION_ID" = "$expected_os"
          test "$online_cpus" -ge "$minimum_cpus"

      - name: Report hardware and toolchain
        shell: bash
        run: |
          set -euo pipefail

          lscpu
          free -h
          rustc --version --verbose
          cargo --version --verbose
          gcc --version
          python3 --version

          if [[ -r /sys/firmware/devicetree/base/model ]]; then
            printf 'board='
            tr -d '\0' </sys/firmware/devicetree/base/model
            printf '\n'
          fi

      - name: Verify native Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version
          docker_architecture="$(docker info --format '{{.Architecture}}')"
          printf 'docker_architecture=%s\n' "$docker_architecture"
          test "$docker_architecture" = riscv64
