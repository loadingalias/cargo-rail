name: Native Cache Qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Expected remote-cache outcome
        required: true
        type: choice
        options:
          - publish
          - hit

concurrency:
  group: native-cache-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: S3 ${{ inputs.mode }}
    if: github.repository == 'loadingalias/cargo-rail'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_RAIL_CACHE_REGION: ${{ vars.CACHE_QUALIFICATION_AWS_REGION }}
      CARGO_RAIL_CACHE_EXPECTED_OWNER: ${{ vars.CACHE_QUALIFICATION_AWS_OWNER }}
      CARGO_RAIL_CACHE_BUCKET: ${{ vars.CACHE_QUALIFICATION_AWS_BUCKET }}
      CARGO_RAIL_CACHE_PREFIX: ${{ vars.CACHE_QUALIFICATION_AWS_PREFIX }}
      CARGO_RAIL_CACHE_TARGETS_FILE: ${{ runner.temp }}/cargo-rail-cache-targets.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Configure scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          aws-region: ${{ vars.CACHE_QUALIFICATION_AWS_REGION }}
          role-to-assume: ${{ vars.CACHE_QUALIFICATION_AWS_ROLE_ARN }}
          role-session-name: cargo-rail-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-key: native-cache-qualification
          install-nextest: "false"

      - name: Qualify native S3 cache
        run: just qualify-native-cache-s3 "${{ inputs.mode }}" "gha-${{ github.run_id }}-${{ inputs.mode }}"

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: native-cache-qualification-${{ github.run_id }}-${{ inputs.mode }}
          path: benchmark_results/native-cache/gha-${{ github.run_id }}-${{ inputs.mode }}
          if-no-files-found: error
          retention-days: 14
