nextest-version = { required = "0.9.144", recommended = "0.9.144" }

[profile.default]
status-level = "pass"
success-output = "never"
failure-output = "immediate-final"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "2s", result = "fail" }
retries = 0
flaky-result = "fail"

[test-groups]
# Cache qualification performs real compilation; integration fixtures mostly run
# independent metadata and Git subprocesses. Keep each resource class bounded
# without forcing both classes through one serial queue.
cache-subprocess = { max-threads = 4 }
integration-subprocess = { max-threads = 10 }

[profile.cranelift]
default-filter = 'test(=test_cache_installation::cranelift_emitted_library_reuse_binds_backend_bytes_and_preserves_assembly_bypass)'

[[profile.default.overrides]]
filter = 'binary(cache) & test(=test_native_cache_fixture::windows_native_driver_bypass_preserves_cargo_workloads)'
test-group = 'cache-subprocess'
priority = 100
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'test(=test_cache_installation::cranelift_emitted_library_reuse_binds_backend_bytes_and_preserves_assembly_bypass)'
test-group = 'cache-subprocess'
priority = 70
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'binary(cache) & test(=test_native_cache_fixture::real_cargo_build_reuses_exact_outputs)'
test-group = 'cache-subprocess'
priority = 100
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'binary(cache) & test(/test_native_cache_fixture::real_cargo_(check|test_targets)_reuse/)'
test-group = 'cache-subprocess'
priority = 100
slow-timeout = { period = "60s", terminate-after = 10 }
leak-timeout = { period = "10s", result = "fail" }

[[profile.default.overrides]]
filter = 'binary(cache) & test(/test_native_cache_fixture::/)'
test-group = 'cache-subprocess'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(cache) & test(=test_cache_installation::direct_s3_remote_is_l2_only_and_falls_back_cold_on_corruption_or_outage)'
test-group = 'cache-subprocess'
priority = 90
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(cache) & test(=test_cache_installation::setup_owned_remote_is_automatic_coordinated_and_removable)'
test-group = 'cache-subprocess'
priority = 80
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(=test_compiler_observation::source_capture_limit_bypasses_cold_without_creating_authority)'
leak-timeout = { period = "10s", result = "fail" }

[[profile.default.overrides]]
filter = 'binary(cache)'
test-group = 'cache-subprocess'

[[profile.default.overrides]]
filter = 'binary(integration) & test(/test_(instrumentation|release_cargo|scale_fixture|source_snapshot|surface|unify|unused_detection|undeclared_features)/)'
test-group = 'integration-subprocess'

[[profile.default.overrides]]
filter = 'test(/test_compiler_observation::stable_(wrapper_authorizes_the_matched_driver_per_compilation_unit|rustdoc_proxy_authorizes_generated_doctest_units)$/) | test(=compiler::facts::tests::manufactured_driver_fragment_passes_the_stable_admission_boundary)'
test-group = 'integration-subprocess'

[profile.cache-host]
fail-fast = false
test-threads = 1

[profile.cache-host.junit]
path = "junit.xml"

[[profile.cache-host.overrides]]
filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 15 }
