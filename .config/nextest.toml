nextest-version = { required = "0.9.143", recommended = "0.9.143" }

[profile.default]
status-level = "pass"
success-output = "never"
failure-output = "immediate-final"
fail-fast = true
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "2s", result = "fail" }
retries = 0
flaky-result = "fail"

[test-groups]
cargo-subprocess = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(/test_native_cache_fixture::real_cargo_check_and_build_reuse_exact_outputs_with_root_bound_authority$/)'
test-group = 'cargo-subprocess'
# This test owns a serial Cargo build matrix with bounded compiler-cache deadlines. Run it first and alone.
priority = 100
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(/test_native_cache_fixture::/)'
test-group = 'cargo-subprocess'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(=test_cache_installation::direct_s3_remote_is_l2_only_and_falls_back_cold_on_corruption_or_outage)'
test-group = 'cargo-subprocess'
priority = 90
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(=test_cache_installation::setup_owned_remote_is_automatic_coordinated_and_removable)'
test-group = 'cargo-subprocess'
# This test owns a bounded loopback server plus two coordinator process trees.
priority = 80
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(=test_compiler_observation::source_capture_limit_bypasses_cold_without_creating_authority)'
leak-timeout = { period = "10s", result = "fail" }

[[profile.default.overrides]]
filter = 'binary(integration) & test(/test_(instrumentation|scale_fixture|source_snapshot|surface|unify|unused_detection|undeclared_features)/)'
test-group = 'cargo-subprocess'
