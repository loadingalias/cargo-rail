# Repository policy. Omitted fields use cargo-rail's coded defaults.

targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[cache]
l2 = "team"

[unify]
include_renamed = true
major_version_conflict = "bump"
max_backups = 2
msrv_policy = { mode = "compute", source = "workspace" }

[release]
tag_format = "{prefix}{version}"
remote_effects = "auto"
sign_tags = true
require_changelog_entries = true
require_change_files = true
unconventional_commits = "deny"

[release.changelog]
emoji = false
group_order = ["breaking", "feat", "fix", "perf", "docs", "deps"]
fallback = "skip"

[release.changelog.filters]
skip_types = ["build", "chore", "ci", "refactor", "style", "test"]

[change-detection]
infrastructure = [
  ".github/**",
  "distribution/**",
  "scripts/**",
  "tests/compatibility/**",
  "justfile",
  "deny.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  ".config/nextest.toml",
  "Cargo.toml",
  "Cargo.lock",
]

[run]
default_profile = "local"

[run.profile.commit]
actions = ["build", "test"]
