# The compiler and backend must match the authenticated driver source.
# Advance this pin only with a passing `just test-cranelift` run.
[toolchain]
channel = "nightly-2026-07-01"
profile = "minimal"
components = ["rustc-dev", "rustc-codegen-cranelift"]

# The authenticated source bundle is qualified at both endpoints. The release
# compiler must match the maximum so widening this interval stays explicit.
[source-support]
minimum-release = "1.98.0-nightly"
maximum-release = "1.98.1"
minimum-commit-date = "2026-06-30"
maximum-commit-date = "2026-09-01"
