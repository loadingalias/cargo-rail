# Updated by just update on the local macOS workstation.
# Installers consume these pins; they never select latest releases.
# Ubuntu system packages come from the guest's archive; a baked image pins them.
# Rust defaults to rust-toolchain.toml; runners declare required channel overrides and components.
# macOS development and testing remain local.

[cargo]
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-nextest = "0.9.148"
cargo-xwin = "0.23.1"
cargo-mutants = "27.1.0"
just = "1.58.0"
ripgrep = "15.2.0"
rumdl = "0.2.79"
lychee = "0.24.2"
samply = "0.13.1"

[operations.ci]
components = ["clippy", "rustfmt", "rustc-dev", "llvm-tools"]
# Integration tests build a foreign Linux target to prove cross-compiler diagnostics.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
cargo = ["cargo-deny", "cargo-nextest", "just"]
assets = ["rustup", "uv", "cargo-binstall", "cmake", "llvm", "git", "actionlint", "cargo-nextest"]
packages = ["build-essential", "ca-certificates", "cmake", "curl", "git", "git-man", "linux-tools-common", "openssl", "pkgconf", "ripgrep", "shellcheck", "unzip", "xz-utils", "zstd"]

[operations.package]
components = ["rustc-dev", "llvm-tools"]
cargo = ["just"]
assets = ["rustup", "uv", "cargo-binstall", "cmake", "llvm", "git"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man", "pkgconf", "unzip", "xz-utils", "zstd"]

# IBM Z, IBM POWER, and RISC-V runners execute the cache tests that x86-64 cross-builds, with the runner tools
# x86-64 also cross-builds. They compile only the compiler driver and the fixtures those tests build.
[operations.cache-host]
components = ["clippy", "rustc-dev"]
cargo = []
assets = ["rustup", "uv"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man"]

# x86-64 builds the complete IBM Z, IBM POWER, and RISC-V test archives; those runners only execute them.
[operations.cross-build]
components = ["clippy", "rustc-dev"]
cargo = ["cargo-nextest", "just"]
assets = ["rustup", "uv", "cargo-binstall", "cmake"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man", "perl", "gcc-riscv64-linux-gnu", "g++-riscv64-linux-gnu", "libc6-dev-riscv64-cross", "gcc-s390x-linux-gnu", "g++-s390x-linux-gnu", "libc6-dev-s390x-cross", "gcc-powerpc64le-linux-gnu", "g++-powerpc64le-linux-gnu", "libc6-dev-ppc64el-cross"]

[versions]
actionlint = "1.7.12"
cargo-binstall = "1.25.3"
cmake = "4.4.4"
llvm = "23.1.3"
git = "2.56.0.windows.2"
rustup = "1.29.1"
uv = "0.13.1"

[linux]
ubuntu = "24.04"

[windows]
# Bound simultaneous Rust links on the smallest provisioned Windows runner.
