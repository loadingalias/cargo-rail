# Updated by just update on the local macOS workstation.
# Installers consume these pins; they never select latest releases.
# Ubuntu system packages are pinned together by archive snapshot.
# Rust defaults to rust-toolchain.toml; runners declare required channel overrides and components.
# macOS development and testing remain local.

[cargo]
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-nextest = "0.9.143"
cargo-xwin = "0.23.1"
cargo-mutants = "27.1.0"
just = "1.58.0"
ripgrep = "15.2.0"
rumdl = "0.2.66"
lychee = "0.24.2"
samply = "0.13.1"

[updater]
tomlkit = "0.15.1"

[operations.ci]
components = ["clippy", "rustfmt", "rustc-dev", "llvm-tools"]
cargo = ["cargo-deny", "cargo-nextest", "just"]
assets = ["rustup", "cargo-binstall", "cmake", "llvm", "git", "python", "actionlint", "cargo-nextest"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man", "openssl", "pkgconf", "python3", "python3-venv", "shellcheck", "unzip", "xz-utils", "zstd"]

[operations.package]
components = ["rustc-dev", "llvm-tools"]
cargo = ["just"]
assets = ["rustup", "cargo-binstall", "cmake", "llvm", "git", "python"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man", "pkgconf", "python3", "unzip", "xz-utils", "zstd"]

[operations.riscv-build]
components = []
cargo = ["cargo-nextest", "just"]
assets = ["rustup", "cargo-binstall", "cmake"]
packages = ["build-essential", "ca-certificates", "curl", "git", "git-man", "python3", "perl", "gcc-riscv64-linux-gnu", "g++-riscv64-linux-gnu", "libc6-dev-riscv64-cross"]

