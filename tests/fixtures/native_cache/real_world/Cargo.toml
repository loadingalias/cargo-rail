[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
cc = "=1.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
fixture-api = { path = "crates/fixture-api" }
fixture-build = { path = "crates/fixture-build" }
fixture-git = { git = "__FIXTURE_GIT_URL__", rev = "__FIXTURE_GIT_REV__" }
fixture-macros = { path = "crates/fixture-macros" }
fixture-native = { path = "crates/fixture-native" }
fixture-native-sys = { path = "crates/fixture-native-sys" }
fixture-service-a = { path = "crates/fixture-service-a" }
fixture-service-b = { path = "crates/fixture-service-b" }
fixture-storage = { path = "crates/fixture-storage" }
fixture-types = { path = "crates/fixture-types", default-features = false }
rayon = "=1.12.0"
regex = "=1.13.1"

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "thin"
