[surface]
enabled = true
consumer_scope = "workspace"
crate_visibility = "allow"
preserve_uniform_fields = true

[[surface.lint]]
selector = "warnings"
level = "deny"

[[surface.lint]]
selector = "unnecessary-crate-visibility"
level = "deny"

[[surface.product]]
package = "surface-conformance-core"
lib = "surface_conformance_core"
reason = "internal library with compiled workspace consumers"

[[surface.feature-profile]]
name = "all-features"
all-features = true

[[surface.doctest]]
package = "surface-conformance-core"
