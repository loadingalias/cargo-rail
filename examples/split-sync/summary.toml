# Split & Sync Example
#
# Demonstrates cargo-rail's crate distribution features:
# - cargo rail split: extract crate(s) with preserved git history
# - cargo rail sync: bidirectional sync with 3-way merge conflict resolution

[example]
type = "workflow"
feature = "split-sync"
commands = ["cargo rail split", "cargo rail sync"]

[notes]
description = """
Split creates a standalone repository from workspace crate(s) with full history.
Uses git filter-repo internally - no manual rebasing or squashing needed.

Sync handles bidirectional changes between monorepo and split repos using 3-way merge:
1. Find common ancestor (last sync point)
2. Diff monorepo changes since ancestor
3. Diff split repo changes since ancestor
4. 3-way merge with configurable conflict resolution

Protected branch handling: --from-remote creates a sync branch instead of
committing directly, allowing PR-based review workflow.
"""

# ============================================================================
# Example rail.toml configurations
# ============================================================================

# Single crate split (most common)
[config.single]
note = "Extract one crate to its own repository"
toml = """
[crates.my-util.split]
remote = "git@github.com:user/my-util.git"
branch = "main"
mode = "single"
paths = [{ crate = "crates/my-util" }]
include = ["LICENSE", "README.md"]
"""

# Combined multi-crate split (flat)
[config.combined_flat]
note = "Multiple related crates, flat directory structure"
toml = """
[crates.my-ecosystem.split]
remote = "git@github.com:user/my-ecosystem.git"
branch = "main"
mode = "combined"
workspace_mode = "standalone"  # No root Cargo.toml
paths = [
    { crate = "crates/core" },
    { crate = "crates/derive" },
]
include = ["LICENSE"]
"""

# Combined multi-crate split (workspace)
[config.combined_workspace]
note = "Multiple crates with workspace structure preserved"
toml = """
[crates.my-ecosystem.split]
remote = "git@github.com:user/my-ecosystem.git"
branch = "main"
mode = "combined"
workspace_mode = "workspace"  # Root Cargo.toml with [workspace]
paths = [
    { crate = "crates/core" },
    { crate = "crates/derive" },
    { crate = "crates/runtime" },
]
include = ["LICENSE", "README.md", "CONTRIBUTING.md", "rust-toolchain.toml"]
exclude = ["**/test-fixtures/**"]
"""

# Per-crate release settings
[config.release_settings]
note = "Control publishing and changelog per crate"
toml = """
# Disable crates.io publish for internal crates
[crates.internal-tools.release]
publish = false

# Custom changelog path
[crates.my-public-crate.changelog]
path = "docs/CHANGELOG.md"
skip = false
"""

# ============================================================================
# Command examples with explanations
# ============================================================================

[[commands]]
cmd = "cargo rail split init my-crate"
desc = "Interactive configuration - adds [crates.my-crate.split] to rail.toml"

[[commands]]
cmd = "cargo rail split my-crate --check"
desc = "Dry run - shows what files would be extracted and commits preserved"

[[commands]]
cmd = "cargo rail split my-crate"
desc = "Execute split - creates standalone repo adjacent to workspace"

[[commands]]
cmd = "cargo rail split --all"
desc = "Split all crates that have [crates.X.split] config"

[[commands]]
cmd = "cargo rail sync my-crate"
desc = "Bidirectional sync - merge changes from both directions"

[[commands]]
cmd = "cargo rail sync my-crate --to-remote"
desc = "Push only - sync monorepo changes to split repo"

[[commands]]
cmd = "cargo rail sync my-crate --from-remote"
desc = "Pull only - sync split repo changes to monorepo (creates branch)"

[[commands]]
cmd = "cargo rail sync my-crate --strategy union"
desc = "Auto-resolve conflicts by combining both changes"

[[commands]]
cmd = "cargo rail sync --all --check"
desc = "Preview sync status for all configured crates"
