# cargo-rail configuration
# Split/Sync-focused example with full [crates.<name>.split] section.

# targets = []  # optional: set for multi-target validation

[crates.my-crate.split]
remote = "git@github.com:your-org/my-crate.git"
branch = "main"
mode = "single" # single | combined
workspace_mode = "standalone" # standalone | workspace
# members defaults to ["my-crate"]; combined splits list package names here.
include = []
exclude = []
