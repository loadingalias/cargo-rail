# Complete release policy. Remote effects stay disabled until you opt in.

[release]
source = "changes" # changes | commits | both
tag_prefix = "v"
tag_format = "{prefix}{version}"
remote_effects = "none" # none | push | auto | github | gitlab
registry_publication = "none" # none | crates-io
sign_tags = false
require_changelog_entries = false
require_release_notes = true
release_notes_dir = "release-notes"
change_dir = ".changes"
pre_1_breaking_bump = "minor" # minor | major
unconventional_commits = "warn" # allow | warn | deny
semver_check = "warn" # off | warn | deny
require_change_files = false

# Lockstep groups require at least two real workspace package names.
# [release.version_groups]
# core = ["core-api", "core-runtime"]

[release.changelog]
path = "CHANGELOG.md"
relative_to = "workspace" # crate | workspace
entry_format = "- {scope}{breaking}{description}{prs} ({sha_link})"
emoji = false
group_order = ["breaking", "feat", "fix", "perf", "docs", "deps", "other"]
fallback = "other" # a group name | skip
commit_url = "https://github.com/your-org/your-repo/commit/{sha}"
pr_url = "https://github.com/your-org/your-repo/pull/{pr}"

[[release.changelog.groups]]
types = ["sec", "security"]
title = "Security"
emoji = "🔒"

[release.changelog.filters]
skip_types = ["chore", "ci"]
skip_scopes = ["internal"]
include_paths = []
exclude_paths = ["fixtures/**"]

[crates.cargo-rail.release]
publish = true

[crates.cargo-rail.changelog]
skip = false
