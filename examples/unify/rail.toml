# Unify policy: every entry differs from cargo-rail's coded defaults.

[unify]
include_renamed = true
major_version_conflict = "bump"
msrv_policy = { mode = "compute", source = "workspace", inherit = true }

# Enable only when this private workspace is the complete consumer graph.
consumer_scope = "workspace"
preserve_features = ["unstable-*", "bench*"]

# Workspace-hack replacement: enabling it also selects its host.
transitive_pinning = { host = "root" }

# Workspace-member cohorts remain atomic when these safety hatches are used.
exclude = ["platform-specific-dep"]
