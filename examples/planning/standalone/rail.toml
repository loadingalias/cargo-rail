# cargo-rail configuration
# For projects WITHOUT a task runner
#
# Strategy: cargo-rail owns scope; Cargo and CI own execution.

[plan.work.repository-validation]
scope = "repository"
paths = [
  ".github/**",
  "scripts/**",
  "deny.toml",
  "rust-toolchain.toml",
  "Cargo.toml",
  "Cargo.lock",
]

[plan.work.stress-test]
scope = "repository"
paths = ["stress-test/**"]
