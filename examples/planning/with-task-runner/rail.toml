# cargo-rail configuration
# For projects WITH a task runner (just, make, xtask, scripts)
#
# Strategy: cargo rail plan provides the execution scope,
# your task runner handles execution.

[change-detection]
infrastructure = [
  ".github/**",
  "scripts/**",
  "justfile",
  "Justfile",
  "Makefile",
  "deny.toml",
  "rust-toolchain.toml",
  "Cargo.toml",
  "Cargo.lock",
]
confidence_profile = "balanced"
unknown_file_policy = "strict"

# Custom surfaces for non-Rust assets
[change-detection.custom]
themes = ["runtime/themes/**"]
queries = ["runtime/queries/**"]
book = ["book/**"]

# Run profiles are optional when using external task runner
# Include them for fallback or local convenience
[run]
default_profile = "local"

[run.profile.local]
actions = ["test"]
baseline = { kind = "merge-base" }

[run.profile.ci]
actions = ["build", "test"]
baseline = { kind = "merge-base" }
