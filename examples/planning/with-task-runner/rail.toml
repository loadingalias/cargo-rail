# cargo-rail configuration
# For projects WITH a task runner (just, make, xtask, scripts)
#
# Strategy: cargo rail plan provides the execution scope,
# your task runner handles execution.

[plan.work.repository-validation]
scope = "repository"
paths = [
  ".github/**",
  "scripts/**",
  "justfile",
  "Justfile",
  "Makefile",
  "deny.toml",
  "rust-toolchain.toml",
  "Cargo.toml",
  "Cargo.lock",
]

[plan.work.themes]
scope = "repository"
paths = ["runtime/themes/**"]

[plan.work.queries]
scope = "repository"
paths = ["runtime/queries/**"]

[plan.work.book]
scope = "repository"
paths = ["book/**"]
