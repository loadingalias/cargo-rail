# Complete Surface policy. Keep only the views and exceptions your workspace needs.

[surface]
enabled = true
consumer_scope = "open" # use workspace only for a closed private consumer graph
targets = ["host"]
crate_visibility = "allow" # preserve | allow
preserve_uniform_fields = true
doctest_coverage = "automatic" # automatic | disabled

[[surface.product]]
package = "cargo-rail"
bin = "cargo-rail"
target = "cfg(unix)"
reason = "shipped command-line application"
# Use `lib = "cargo_rail"` instead of `bin` for a library product.

[[surface.feature-profile]]
name = "all"
all-features = true

[[surface.feature-profile]]
name = "minimal"
no-default-features = true
features = []

[[surface.doctest]]
package = "cargo-rail"

[[surface.external]]
crate = "cargo_rail"
reason = "public library consumers remain outside workspace authority"

[[surface.lint]]
selector = "warnings"
level = "warn"

[[surface.lint]]
selector = "dead-public"
level = "deny"

[[surface.override]]
lint = "dead-public"
crate = "cargo_rail"
# Use `package = "cargo-rail"` instead of `crate` for package ownership.
item = "compatibility::legacy_entry"
kind = "function"
target = "cfg(unix)"
level = "allow"
reason = "compatibility entry point"

[[surface.exclude]]
package = "cargo-rail"
file = "src/main.rs"
target = "cfg(windows)"
level = "allow"
reason = "platform entry-point glue"

[[surface.exclude]]
crate = "cargo_rail"
module = "generated"
level = "allow"
reason = "generated declarations"
