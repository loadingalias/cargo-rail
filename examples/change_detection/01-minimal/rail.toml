# cargo-rail configuration
# Minimal complete baseline for planner + executor sections.

# targets = []  # optional: set for multi-target validation

[change-detection]
# Paths that trigger full workspace rebuild
infrastructure = [
  ".github/**",
  "scripts/**",
  "justfile",
  "Justfile",
  "Makefile",
  "makefile",
  "GNUmakefile",
  "*.sh",
  "Taskfile.yml",
  "Taskfile.yaml",
  ".pre-commit-config.yaml",
  "deny.toml",
  "cliff.toml",
  "release.toml",
  "release-plz.toml",
]
conservative_unclassified_owner_fallback = true
confidence_profile = "balanced"
# bot_pr_confidence_profile = "strict"  # optional bot PR override

[run]
default_profile = "local"

[run.profile.local]
surfaces = ["test"]
run_args = []
merge_base = true

[run.profile.ci]
surfaces = ["build", "test"]
run_args = ["--workspace", "{cargo_args}"]
merge_base = true
