# Sparse cargo-rail policy example. Omitted fields use coded defaults.

targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[unify]
include_renamed = true
major_version_conflict = "bump"
msrv_policy = { mode = "compute", source = "workspace" }
consumer_scope = "workspace"

[release]
tag_format = "{prefix}{version}"
remote_effects = "auto"
sign_tags = true
require_change_files = true
unconventional_commits = "deny"

[release.changelog]
relative_to = "workspace"
emoji = false
fallback = "skip"

[release.changelog.filters]
skip_types = ["build", "chore", "ci", "refactor", "style", "test"]

[change-detection]
infrastructure = [".github/**", "scripts/**", "Cargo.toml", "Cargo.lock"]
confidence_profile = "strict"

[change-detection.custom]
verification = ["verification/**"]

[run]
default_profile = "commit"

[run.profile.commit]
actions = ["build", "test"]
baseline = { kind = "merge-base" }

[crates.my-crate.split]
remote = "git@github.com:your-org/my-crate.git"
branch = "main"
mode = "single"
members = ["my-crate"]

[crates.my-crate.release]
publish = true
