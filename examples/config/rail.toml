# cargo-rail configuration
# Generated by: cargo rail init
# Documentation: https://github.com/loadingalias/cargo-rail/blob/main/docs/config.md
#
# Commands:
#   cargo rail init           - Generate this config
#   cargo rail config sync    - Update config with new defaults
#   cargo rail config validate - Validate configuration
#
# Exit codes: 0 = success, 1 = changes needed (--check), 2 = error

# Platform targets for multi-target validation
# Detected from Cargo.toml [package.metadata.docs.rs] or .github/workflows
targets = [
  # Tier 1 (Guaranteed)
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  # Tier 2 (Common)
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
]

# ============================================================================
# DEPENDENCY UNIFICATION
# ============================================================================
# Consolidates workspace dependencies, fixes undeclared features, prunes dead
# features, detects unused deps, and computes MSRV.
#
# Replaces: cargo-hakari, cargo-udeps, cargo-machete, cargo-shear,
#           cargo-features-manager, cargo-msrv, cargo-sort

[unify]
# Core unification
include_paths = true              # Handle path dependencies (default: true)
include_renamed = true            # Handle renamed deps (package = "...") (default: false)
strict_version_compat = true      # Treat version mismatches as errors (default: true)
sort_dependencies = true          # Sort deps alphabetically (default: true)

# Workspace-hack replacement (cargo-hakari alternative)
pin_transitives = false           # Pin transitive-only deps (default: false)
transitive_host = "root"          # Where to put pinned transitive dev-deps

# Safety hatches
exclude = []                      # Dependencies to skip unification
include = []                      # Dependencies to force unification
exact_pin_handling = "warn"       # How to handle =x.y.z pins: skip, preserve, warn
major_version_conflict = "bump"   # Major conflicts: warn (skip), bump (force highest)

# Feature management
prune_dead_features = true        # Remove features never enabled (default: true)
consumer_scope = "open"           # Use "workspace" only for a closed private consumer graph
preserve_features = []            # Features to preserve from pruning (glob patterns)
detect_undeclared_features = true # Detect borrowed features (default: true)
fix_undeclared_features = true    # Auto-fix borrowed features (default: true)
skip_undeclared_patterns = ["default", "std", "alloc", "*_backend", "*_impl"]

# Unused dependency detection
detect_unused = true              # Detect unused dependencies (default: true)
compiler_diag_cache = true        # Reuse compiler evidence when its full identity matches
remove_unused = true              # Auto-remove unused deps (default: true)

# MSRV computation
msrv = true                       # Compute workspace rust-version (default: true)
msrv_source = "max"               # How to compute: deps, workspace, max (default: max)
enforce_msrv_inheritance = false  # Ensure members inherit workspace rust-version

# Backups
max_backups = 3                   # Number of backup files to keep (default: 3)

# ============================================================================
# CHANGE DETECTION
# ============================================================================
# Deterministic file-first change planning for CI gating.

[change-detection]
# Files that trigger full workspace rebuild when changed
infrastructure = [
  ".github/**",
  "scripts/**",
  "justfile",
  "Justfile",
  "Makefile",
  "deny.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  ".config/nextest.toml",
  "Cargo.toml",
  "Cargo.lock",
]

# Planner confidence profiles: strict, balanced, fast
confidence_profile = "balanced"

# Optional override for bot-authored PRs (e.g., dependabot)
bot_pr_confidence_profile = "strict"

# Unknown files: crate-owned => build+test, everything else => infra
unknown_file_policy = "strict"

# Custom surfaces (triggers custom:<name> in plan output)
# [change-detection.custom]
# themes = ["runtime/themes/**"]
# queries = ["runtime/queries/**"]
# workloads = ["workloads/**"]

# ============================================================================
# RUN PROFILES
# ============================================================================
# Execution profiles for `cargo rail run`.

[run]
default_profile = "local"         # Default when no --profile/--surface specified

# Workflow-to-profile mapping (for CI wrappers)
[run.workflow]
commit = "ci"
nightly = "nightly"

# Local development profile
[run.profile.local]
surfaces = ["test"]
merge_base = true

# CI profile
[run.profile.ci]
surfaces = ["build", "test"]
run_args = ["--workspace", "{cargo_args}"]
merge_base = true

# Nightly profile
[run.profile.nightly]
surfaces = ["build", "test", "docs", "bench"]
run_args = ["--workspace", "{cargo_args}"]
merge_base = true

# ============================================================================
# RELEASE
# ============================================================================
# Version bumps, changelogs, tags, and crates.io publishing.
#
# Replaces: release-plz, cargo-release, git-cliff

[release]
tag_prefix = "v"                  # Prefix for all tags
tag_format = "{prefix}{version}"  # Tag format (single-crate: v0.1.0)
require_clean = true              # Require clean worktree
publish_delay = 5                 # Seconds between crate publishes
create_github_release = false     # Create forge releases via gh/glab when true
forge = "auto"                    # Release creation: auto, github, gitlab
sign_tags = true                  # GPG sign tags
require_changelog_entries = false # Require changelog entries before release
pre_1_breaking_bump = "minor"     # --bump auto: breaking on 0.x is "minor" or "major"
unconventional_commits = "warn"   # Non-conventional commits: "allow", "warn", "deny"
semver_check = "warn"             # cargo-semver-checks policy: "off", "warn", "deny"
change_dir = ".changes"           # Pending release intent files
require_change_files = false      # Require change-file coverage: true, false, or [crates]

[release.changelog]
path = "CHANGELOG.md"             # Changelog file path
relative_to = "crate"             # "crate" or "workspace"
group_order = ["breaking", "feat", "fix", "perf", "docs", "deps", "other"]
fallback = "other"                # Unlisted commit types land here; "skip" drops them

# ============================================================================
# PER-CRATE CONFIGURATION
# ============================================================================
# Override workspace defaults for specific crates.

# Example: Split/sync configuration
# [crates.my-crate.split]
# remote = "git@github.com:org/my-crate.git"
# branch = "main"
# mode = "single"                 # "single", "combined", or "workspace"
# paths = [{ crate = "crates/my-crate" }]

# Example: Release configuration
# [crates.my-crate.release]
# publish = true

# Example: Changelog configuration
# [crates.my-crate.changelog]
# path = "CHANGELOG.md"
# relative_to = "crate"
