[package]
name = "cargo-rail-windows-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["loadingalias"]
description = "Narrow safe Windows filesystem primitives for cargo-rail"
repository = "https://github.com/loadingalias/cargo-rail"
publish = ["crates-io"]
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/README.md"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
