[package]
name = "cargo-rail-fact-driver"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
build = "build.rs"

[workspace]
members = ["."]
resolver = "3"

[[bin]]
name = "cargo-rail-fact-driver"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
