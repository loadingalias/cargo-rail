[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Only allow licenses we actually encounter
allow = [
  "MIT",
  "Apache-2.0",
  # aws-lc-sys/aws-lc-rs are transitive AWS SDK TLS dependencies.
  "BSD-3-Clause",
  "ISC",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

skip = [
  # petgraph 0.8.3 requires hashbrown 0.15; current indexmap and tooling use
  # hashbrown 0.17. Both lines are required until petgraph publishes its
  # hashbrown 0.16 update.
  "hashbrown@0.15.5",
  "foldhash@0.1.5",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
