[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "riscv64gc-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
yanked = "deny"
unsound = "all"

[licenses]
# Only allow licenses we actually encounter
allow = [
  "MIT",
  "Apache-2.0",
  # aws-lc-sys/aws-lc-rs are transitive AWS SDK TLS dependencies.
  "BSD-3-Clause",
  "ISC",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

skip = [
  # The AWS SDK currently spans the RustCrypto 0.10 and 0.11 dependency lines;
  # remove these skips when its graph converges on one compatible line.
  "block-buffer@0.10.4",
  "cpufeatures@0.2.17",
  "crypto-common@0.1.7",
  "digest@0.10.7",
  "sha1@0.10.7",
  # The AWS SDK deliberately supports both HTTP 0.2 and 1.x; remove these skips
  # when its compatibility surface no longer requires HTTP 0.2.
  "http@0.2.12",
  "http-body@0.4.6",
  # petgraph, the AWS SDK's LRU cache, and indexmap use successive hashbrown
  # lines; remove these skips when those constraints converge.
  "hashbrown@0.15.5",
  "foldhash@0.1.5",
  # Proc-macro dependencies are still split between Syn 2 and 3; remove this
  # skip when all selected proc macros accept one Syn line.
  "syn@2.0.119",
]

[bans.std-replacements]
scope = "workspace"
level = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
