[package]
name = "cargo-rail"
version = "0.21.0"
default-run = "cargo-rail"
edition = "2024"
rust-version = { workspace = true }
license = "MIT"
authors = ["loadingalias"]
description = "Cargo-native Rust workspace engine for affected CI, verified compiler reuse, dependency coherence, exact-SHA releases, and crate split/sync"
repository = "https://github.com/loadingalias/cargo-rail"
documentation = "https://docs.rs/cargo-rail"
categories = [
    "development-tools::cargo-plugins",
    "development-tools::build-utils",
    "development-tools::testing",
    "command-line-utilities",
]
keywords = ["cargo", "workspace", "build-cache", "cicd", "release"]
readme = "README.md"
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/schemas/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "!**/.DS_Store",
]

[workspace]
members = ["."]
exclude = ["tools/compiler-fact-driver"]
resolver = "3"

[workspace.package]
rust-version = "1.97.1"

[dependencies]
aws-config = { version = "1.10.1", default-features = false, features = ["default-https-client", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.5.0"
async-trait = "0.1.92"
azure_core = { version = "1.0.0", default-features = false, features = ["reqwest", "reqwest_rustls", "tokio"] }
azure_identity = { version = "1.0.0", default-features = false, features = ["tokio"] }
azure_storage_blob = { version = "1.0.0", default-features = false, features = ["tokio"] }
clap = { version = "4.6.5", features = ["derive", "cargo"] }
clap_complete = "4.6.8"
cargo_metadata = "0.23.1"
petgraph = { version = "0.8.3", default-features = false }
toml_edit = { version = "0.25.13", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
rayon = "1.12.0"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
winnow = "1.0.4"
chrono = "0.4.45"
glob = "0.3.4"
getrandom = "0.4.3"
futures-util = "0.3.33"
rustc-hash = "2.1.3"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "rt-multi-thread", "time"] }
zstd = { version = "0.13.3", default-features = false }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1.0.104"
jsonschema = { version = "0.49.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
unwrap_used = "allow"
expect_used = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

# Exact observation paths hash compiler artifacts and tool executables even in tests.
[profile.dev.package.sha2]
opt-level = 3

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# cargo-binstall metadata for pre-built binary downloads
# See: https://github.com/cargo-bins/cargo-binstall
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

# Windows uses .zip instead of .tar.gz
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
