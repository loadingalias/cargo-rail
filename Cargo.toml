[package]
name = "cargo-rail"
version = "0.15.0"
edition = "2024"
rust-version = { workspace = true }
license = "MIT"
authors = ["loadingalias"]
description = "Graph-aware CI, dependency unification, changesets-style releases, and crate split/sync for Rust workspaces"
repository = "https://github.com/loadingalias/cargo-rail"
documentation = "https://docs.rs/cargo-rail"
categories = [
    "development-tools::cargo-plugins",
    "development-tools::build-utils",
    "development-tools::testing",
    "command-line-utilities",
]
keywords = ["monorepo", "workspace", "changesets", "release", "cicd"]
readme = "README.md"
exclude = [
    "docs/",
    "tests/",
    ".github/",
    ".config/",
    "examples/",
    "scripts/",
    "distribution/",
    "backlog/",
]

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
rust-version = "1.95.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "cargo"] }
clap_complete = "4.6.2"
cargo_metadata = "0.23.1"
petgraph = { version = "0.8.3", default-features = false }
toml_edit = { version = "0.25.11", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
rayon = "1.12.0"
winnow = "1.0.1"
chrono = "0.4.44"
glob = "0.3.3"
rustc-hash = "2.1.2"
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
anyhow = "1.0.102"
jsonschema = { version = "0.47.0", default-features = false }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
unwrap_used = "allow"
expect_used = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# cargo-binstall metadata for pre-built binary downloads
# See: https://github.com/cargo-bins/cargo-binstall
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

# Windows uses .zip instead of .tar.gz
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
