[package]
name = "cargo-rail"
version = "0.20.0"
edition = "2024"
rust-version = { workspace = true }
license = "MIT"
authors = ["loadingalias"]
description = "Cargo-native Rust workspace engine for affected CI, verified compiler reuse, dependency coherence, exact-SHA releases, and crate split/sync"
repository = "https://github.com/loadingalias/cargo-rail"
documentation = "https://docs.rs/cargo-rail"
categories = [
    "development-tools::cargo-plugins",
    "development-tools::build-utils",
    "development-tools::testing",
    "command-line-utilities",
]
keywords = ["cargo", "workspace", "build-cache", "cicd", "release"]
readme = "README.md"
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/schemas/**",
    "/distribution/native-cache-capabilities.json",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "!**/.DS_Store",
]

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
rust-version = "1.97.1"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "cargo"] }
clap_complete = "4.6.8"
cargo_metadata = "0.23.1"
petgraph = { version = "0.8.3", default-features = false }
toml_edit = { version = "0.25.13", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
rayon = "1.12.0"
winnow = "1.0.4"
chrono = "0.4.45"
glob = "0.3.4"
rustc-hash = "2.1.3"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
    "std",
] }

[dev-dependencies]
anyhow = "1.0.104"
jsonschema = { version = "0.49.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
unwrap_used = "allow"
expect_used = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

# Exact observation paths hash compiler artifacts and tool executables even in tests.
[profile.dev.package.sha2]
opt-level = 3

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# cargo-binstall metadata for pre-built binary downloads
# See: https://github.com/cargo-bins/cargo-binstall
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

# Windows uses .zip instead of .tar.gz
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
